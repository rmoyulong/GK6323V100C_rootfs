name: 编译gk6323v100c trixie RootFS Armbain(Nginx/PHP8/LMS/samba/wsdd2)

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: 'Debian 套件(trixie = PHP 8.4)'
        required: false
        default: 'trixie'
  push:
    paths:
      - '.github/workflows/create_6323_rootfs.yaml'

permissions:
  contents: write

jobs:
  build-rootfs-gk6323:
    name: 编译国科gk6323v100c基于armbian的rootfs
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 安装交叉编译链、QEMU 模拟器与镜像处理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git build-essential gcc-aarch64-linux-gnu \
              bison flex libssl-dev device-tree-compiler \
              python3 python3-dev swig bc u-boot-tools \
              curl jq parted kpartx dosfstools e2fsprogs util-linux dos2unix \
              qemu-user qemu-user-binfmt
            
      - name: 克隆相关源码仓库
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: 下载 Armbian S905X 基础镜像
        run: |
          mkdir -p work_img
          cd work_img
          
            #Fetch latest S905X (GXL) Armbian image URL from rmoyulong releases
            IMG_URL=$(curl -sL "https://api.github.com/repos/rmoyulong/amlogic-s9xxx-armbian/releases?per_page=2" \
              | jq -r '.[] 
                | select(.tag_name | test("trixie"; "i")) 
                | .assets[] 
                | select(.name | test("Armbian_.*_amlogic_s905lb-r3300l_trixie_.*\\.img\\.gz$")) 
                | .browser_download_url' \
              | head -n 1)
              
            echo $IMG_URL
          
          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            echo "错误：未能获取到 Armbian S905X 基础镜像下载链接！"
            exit 1
          fi
          
          echo "正在下载基础镜像: $IMG_URL"
          curl -L "$IMG_URL" -o base_armbian.img.gz
          
          echo "正在解压基础镜像..."
          gunzip -c base_armbian.img.gz > armbian_s905_p212.img
          
      - name: 预装 LMS samba squeezelite nginx php8 wsdd2 并DIY配置
        run: |
            set -e
            cd work_img
            mkdir -p ext4_mnt

            ############### 给 p2 扩容 500M 开始 ######################################
            IMG=armbian_s905_p212.img
            GROW_MB=500          # 在现有 P2 基础上额外增加的容量
            ALIGN_MB=20          # 额外余量，避免边界问题

            # P2 起始扇区（单位 s）
            P2_START_SECTOR=$(parted -ms "$IMG" unit s print | awk -F: '$1=="2"{gsub(/s/,"",$2); print $2}')

            # P2 当前大小（单位 MB，四舍五入）
            CURRENT_P2_MB=$(parted -ms "$IMG" unit MB print | awk -F: '$1=="2"{gsub(/MB/,"",$4); printf "%.0f", $4}')

            if [ -z "$P2_START_SECTOR" ] || [ -z "$CURRENT_P2_MB" ]; then
              echo "无法解析 P2 分区信息，请检查镜像分区表" >&2
              exit 1
            fi

            # 需要追加到文件尾的 MB 数 = 目标增量 + 对齐余量
            ADD_MB=$((GROW_MB + ALIGN_MB))
            TARGET_P2_MB=$((CURRENT_P2_MB + GROW_MB))

            echo "P2 当前 ${CURRENT_P2_MB}MB，目标 ${TARGET_P2_MB}MB，文件追加 ${ADD_MB}MB..."

            dd if=/dev/zero bs=1M count="$ADD_MB" status=none >> "$IMG"

            # GPT 镜像：把备份头移到文件尾；MBR 可注释掉
            sudo sgdisk -e "$IMG" >/dev/null 2>&1 || true

            sudo parted -s "$IMG" rm 2
            sudo parted -s "$IMG" unit s mkpart primary ext4 "${P2_START_SECTOR}s" 100%

            echo "P2 已扩容到约 ${TARGET_P2_MB}MB（文件实际追加 ${ADD_MB}MB，含 ${ALIGN_MB}MB 余量）"
            ############### 给 p2 扩容 500M 结束 ######################################

            echo "正在关联循环设备并检查修复分区..."
            LOOP_DEV=$(sudo losetup --find --show --partscan armbian_s905_p212.img)
            sudo partprobe "$LOOP_DEV" 2>/dev/null || true
            sleep 1

            if [ ! -b "${LOOP_DEV}p2" ]; then
              echo "未找到 ${LOOP_DEV}p2，分区扫描失败" >&2
              sudo losetup -d "$LOOP_DEV"
              exit 1
            fi

            echo "正在对 ROOT 分区 (${LOOP_DEV}p2) 执行 e2fsck 预校验与修复..."
            sudo e2fsck -fy "${LOOP_DEV}p2" || rc=$?
            if [ "${rc:-0}" -gt 2 ]; then
              echo "e2fsck 返回 ${rc}，存在未修复错误" >&2
              sudo losetup -d "$LOOP_DEV"
              exit 1
            fi

            sudo tune2fs -O ^metadata_csum_seed "${LOOP_DEV}p2" 2>/dev/null || true
            sudo e2fsck -fy "${LOOP_DEV}p2" || rc=$?
            if [ "${rc:-0}" -gt 2 ]; then
              echo "e2fsck 第二次返回 ${rc}，存在未修复错误" >&2
              sudo losetup -d "$LOOP_DEV"
              exit 1
            fi

            echo "分区大小: $(sudo blockdev --getsize64 "${LOOP_DEV}p2") bytes"
            sudo resize2fs "${LOOP_DEV}p2"

            sync

            # ================= 挂载 ROOT 分区并安装软件 =================
            echo "正在挂载 ROOT 分区并通过 QEMU chroot 预装 squeezelite 和 wsdd2..."
            sudo mkdir -p /mnt/armbian_root
            sudo mount "${LOOP_DEV}p2" /mnt/armbian_root
            
            # 在 chroot 内执行 默认使用bash
            sudo chsh -s /bin/bash root
            # 或者对普通用户
            #sudo chsh -s /bin/bash squeezeboxserver

            # 把 patch 目录整体拷进目标根，chroot 内通过 /tmp/patch 访问
            sudo mkdir -p /mnt/armbian_root/tmp/patch
            sudo cp -a "${{ github.workspace }}/patch/." /mnt/armbian_root/tmp/patch/

            # 备份镜像原有的 resolv.conf（如果是软链接则保留原状态）并注入宿主机的 DNS
            if [ -L /mnt/armbian_root/etc/resolv.conf ]; then
              sudo mv /mnt/armbian_root/etc/resolv.conf /mnt/armbian_root/etc/resolv.conf.bak
            elif [ -f /mnt/armbian_root/etc/resolv.conf ]; then
              sudo cp -a /mnt/armbian_root/etc/resolv.conf /mnt/armbian_root/etc/resolv.conf.bak
            fi
            sudo cp /etc/resolv.conf /mnt/armbian_root/etc/resolv.conf

            # 复制 aarch64 模拟器 qemu-aarch64 并挂载虚拟文件系统
            sudo cp /usr/bin/qemu-aarch64 /mnt/armbian_root/usr/bin/
            sudo mount -t proc /proc /mnt/armbian_root/proc
            sudo mount -t sysfs /sys /mnt/armbian_root/sys
            sudo mount -o bind /dev /mnt/armbian_root/dev
            sudo mount -o bind /dev/pts /mnt/armbian_root/dev/pts

            # 第一轮 chroot：基础包 + 系统配置（不涉及 samba/LMS 配置覆盖）
            sudo chroot /mnt/armbian_root /bin/bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends dos2unix qemu-utils dosfstools dump parted bzip2 kpartx build-essential net-tools cifs-utils bind9-dnsutils ethtool screen wget curl sudo file mtools p7zip-full git nginx php8.4-cgi php8.4-fpm php8.4-mysql usbutils pciutils e2fsprogs rsync
              apt-get install -y --no-install-recommends squeezelite wsdd2 alsa-utils alsa-tools ffmpeg

              #################### 必要的设置开始 ######################
              # 挂载目录
              sudo mkdir -p /mnt/{aliyundrive,boot,rootfs,music,sd,usb,NAS}

              # banner
              sudo mkdir -p "/etc/update-motd.d"
              sudo cp /tmp/patch/cats_banner /etc/cats_banner
              sudo tee "/etc/update-motd.d/40-cats_banner" > /dev/null <<'EOF'
              #!/bin/bash
              set -o pipefail
              cat /etc/cats_banner
              EOF
              sudo chmod +x /etc/update-motd.d/40-cats_banner

              # 修改为中国时间
              sudo rm -rf /etc/localtime
              sudo ln -s /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

              # 修正为中文环境
              sudo mkdir -p "/etc/default"
              sudo cp /tmp/patch/locale.conf /etc/default/locale.conf
              sudo cp /tmp/patch/locale.gen /etc/locale.gen
              sudo cp /tmp/patch/locale.conf /etc/locale.conf

              sudo mkdir -p "/etc/sysctl.d"
              sudo tee "/etc/sysctl.d/99-lms-network.conf" > /dev/null <<'EOF'
              # LMS 高解析度音乐异步推流网络优化
              net.core.somaxconn = 1024
              net.core.netdev_max_backlog = 5000
              net.core.rmem_max = 16777216
              net.core.wmem_max = 16777216
              net.ipv4.tcp_rmem = 4096 87380 16777216
              net.ipv4.tcp_wmem = 4096 65536 16777216
              EOF
              echo "----- 99-lms-network.conf -----"
              cat "/etc/sysctl.d/99-lms-network.conf"

              # .bashrc 正确路径是 /root/.bashrc
              sudo cp /tmp/patch/.bashrc /root/.bashrc
              sudo chmod 0644 /root/.bashrc
              #################### 必要的设置结束 ######################

              ################# 建立启动后运行一次的脚本-开始 ################################################
              sudo mkdir -p "/etc/systemd/system"
              sudo tee "/etc/systemd/system/resize-once.service" > /dev/null <<'EOF'
              [Unit]
              Description=One-time resize script
              After=multi-user.target
              ConditionPathExists=/etc/resize.sh

              [Service]
              Type=oneshot
              ExecStart=/etc/resize.sh
              RemainAfterExit=no

              [Install]
              WantedBy=multi-user.target
              EOF

              sudo tee "/etc/resize.sh" > /dev/null <<'EOF'
              #!/bin/bash
              set -euo pipefail

              # ===== 你的 resize 逻辑写在这里 =====
              chown root:root /etc/sudo.conf /etc/sudoers
              chown -R root:root /etc/sudoers.d
              chown root:root /usr/bin/sudo
              chmod 4755 /usr/bin/sudo

              ROOT_PART=$(findmnt -n -o SOURCE /)
              resize2fs "$ROOT_PART"

              chown squeezeboxserver:nogroup /var/lib/squeezeboxserver/prefs
              chown -R squeezeboxserver:nogroup /var/lib/squeezeboxserver/cache
              chown -R squeezeboxserver:nogroup /var/log/squeezeboxserver

              systemctl restart lyrionmusicserver
              # ===================================

              # 执行完毕后自毁：禁用并删除服务、删除脚本自身
              systemctl disable resize-once.service 2>/dev/null || true
              rm -f /etc/systemd/system/resize-once.service
              rm -f /etc/resize.sh
              systemctl daemon-reload
              EOF
              ################# 建立启动后运行一次的脚本-结束 ################################################

              systemctl enable squeezelite wsdd2 || true
            "

            # 第二轮 chroot：安装 samba / LMS，并在安装完成后再覆盖配置
            sudo chroot /mnt/armbian_root /bin/bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get install -y sudo samba samba-common-bin smbclient locales exfat-fuse exfatprogs zip unzip

              # 添加中文
              locale-gen zh_CN.UTF-8

              git clone https://github.com/rmoyulong/packages_lang_golang golang

              rm -rf /var/lib/squeezeboxserver /var/log/squeezeboxserver
              mkdir -p /var/lib/squeezeboxserver/prefs
              mkdir -p /var/lib/squeezeboxserver/cache
              mkdir -p /var/log/squeezeboxserver

              dpkg -i ./golang/lms_arm.deb || true
              apt-get --fix-broken install -y

              # ---- 安装完成后再覆盖 samba 配置，避免被包 postinst 覆盖 ----
              sudo mkdir -p "/etc/samba"
              sudo cp /tmp/patch/smb.conf /etc/samba/smb.conf
              testparm -s /etc/samba/smb.conf || echo "警告：smb.conf 校验失败"

              # ---------- squeezelite 的 ALSA 输出 ----------
              sudo tee "/etc/default/squeezelite" > /dev/null <<'EOF'
              # Defaults for squeezelite initscript
              # sourced by /etc/init.d/squeezelite
              # installed at /etc/default/squeezelite by the maintainer scripts

              # The name for the squeezelite player:
              SL_NAME="Squeezelite"

              # ALSA output device
              # hw:1,0 为硬件直通；若采样率不匹配导致中断，改用 plughw:1,0
              SL_SOUNDCARD="hw:1,0"

              # Additional options to pass to squeezelite:
              SB_EXTRA_ARGS="-p 99 -r 44100-48000 -b 2048:3445 -C 5"
              EOF

              echo "----- /etc/default/squeezelite -----"
              sudo cat "/etc/default/squeezelite"

              # ---------- LMS plugins：解压到正确目录 ----------
              sudo mkdir -p "/var/lib/squeezeboxserver/cache/InstalledPlugins/Plugins"
              sudo mkdir -p "/var/lib/squeezeboxserver/prefs/plugin"
              echo "--- 插件包内容预览 ---"
              sudo tar tzf ./golang/plugins.tar.gz | head -5
              sudo tar zxvfp ./golang/plugins.tar.gz -C "/"
              sudo chown -R squeezeboxserver:nogroup /var/lib/squeezeboxserver/cache/InstalledPlugins
              sudo chown -R squeezeboxserver:nogroup /var/lib/squeezeboxserver/prefs
              rm -rf ./golang
              
              # ---------- 添加GK6323V100C生成物-模块 ----------
              sudo rm -rf /usr/lib/modules/*
              sudo mkdir -p "/usr/lib/modules"
              wget https://github.com/rmoyulong/GK6323V100C/releases/download/gk6323v100c-latest/modules.tar.gz -O modules.tar.gz
              sudo tar zxvfp "./modules.tar.gz" -C "/usr"
              rm modules.tar.gz
              
              # ---------- 添加fstab ----------
              sudo tee "/etc/fstab" > /dev/null <<'EOF'
              # /etc/fstab: static file system information.
              /dev/mmcblk0p18 /               ext4    defaults,noatime,errors=remount-ro 0       1
              tmpfs           /tmp            tmpfs   defaults,nosuid                    0       0
              EOF
              echo "----- /etc/fstab -----"
              cat "/etc/fstab"              

              systemctl enable smbd lyrionmusicserver || true
              apt-get clean
              rm -rf /var/lib/apt/lists/*
            "

            # 清理 chroot 环境并恢复 DNS 配置
            sudo umount -lf /mnt/armbian_root/dev/pts
            sudo umount -lf /mnt/armbian_root/dev
            sudo umount -lf /mnt/armbian_root/sys
            sudo umount -lf /mnt/armbian_root/proc
            sudo rm -f /mnt/armbian_root/usr/bin/qemu-aarch64
            sudo rm -f /mnt/armbian_root/etc/resolv.conf
            if [ -e /mnt/armbian_root/etc/resolv.conf.bak ] || [ -L /mnt/armbian_root/etc/resolv.conf.bak ]; then
              sudo mv /mnt/armbian_root/etc/resolv.conf.bak /mnt/armbian_root/etc/resolv.conf
            fi
            # 删除临时 patch 目录，避免残留在镜像里
            sudo rm -rf /mnt/armbian_root/tmp/patch            
            sudo sync
            
            #获得rootfs 分区的UUID
            ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP_DEV}p2")
            #==============================================================================
            # 先缩文件系统到最小（在 p2 上操作，需先 e2fsck）
            sudo e2fsck -f "${LOOP_DEV}p2"
            sudo resize2fs -M "${LOOP_DEV}p2"
            
            rootfs_image="rootfs.img"
            EXTRA_MB=300
            FS_BYTES=$(sudo tune2fs -l "${LOOP_DEV}p2" | awk '/Block count/{c=$3} /Block size/{s=$3} END{print c*s}')

            # 目标字节数 = 文件系统大小 + 300MB
            TARGET_BYTES=$(( FS_BYTES + EXTRA_MB * 1024 * 1024 ))

            # dd 用 bs=1M，向上取整到 MB
            TARGET_MB=$(( (TARGET_BYTES + 1048575) / 1048576 ))
            sudo dd if=/dev/zero of="$rootfs_image" bs=1M count="$TARGET_MB"
            sudo mkfs.ext4 -U "$ROOT_UUID" -L rootfs "$rootfs_image"
            
            sudo mount "$rootfs_image" ext4_mnt
            sudo cp -rfp /mnt/armbian_root/* ext4_mnt/
            sudo umount ext4_mnt        

            # =====================================================================
            #终止挂载
            sudo umount /mnt/armbian_root              
            sudo losetup -d "${LOOP_DEV}"
            # =====================================================================
            
            #BUILD_DATE=$(date +%Y.%m.%d)
            #OUT_NAME="Armbian_${BUILD_DATE}_s905_p212.img.gz"
            #echo "正在压缩生成最终镜像: $OUT_NAME..."
            #gzip -c armbian_s905_p212.img > "../${OUT_NAME}"
            
            OUT_NAME="rootfs.img.gz"
            gzip -c "$rootfs_image" > "../${OUT_NAME}"
            rm -f base_armbian.img.gz armbian_s905_p212.img
            cd ..
            sha256sum rootfs.img.gz > sha256sums.txt
            ls -lh "${OUT_NAME}"

      - name: 发布构建产物至 gk6323v100c_rootfs 标签
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gk6323v100c_rootfs
          name: 国科GK6323V100C使用的ROOTFS，基于ARMBIAN改造！
          body: |
            - ➦ 💻 固件平台：arm64-linux GK6323V100C（四核 64 位 ARM Cortex-A55）
            - ➦ 🚀 内核版本：${{ env.KERNEL_VERSION }}（配合 kernel-image 发布使用）
            - ➦ 📦 软件包：openssh-server / vsftpd / nginx / php8.4-cgi / php8.4-fpm / LMS /wsdd2 /samba
            - ➦ 🎵 音频：squeezelite 默认 hw:1,0 若播放中断请改用 plughw:1,0
            ---

            **初始 root 密码：`1234`**
            SSH 与 WinSCP SFTP 均可直接用 root / 1234 登录，登录后请尽快修改密码。
          files: |
            rootfs.img.gz
            sha256sums.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
