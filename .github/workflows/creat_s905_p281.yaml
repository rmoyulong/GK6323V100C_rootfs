name: 构建北京联通Q5 Armbian S905 GXL(792MHz DDR3)TF/SD卡启动镜像

on:
  workflow_dispatch:
  push:
    tags:
      - 's905_p281'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc-aarch64-linux-gnu bison flex libssl-dev device-tree-compiler python3 python3-pyelftools bc swig libncurses-dev curl jq parted kpartx gzip

      - name: Clone U-Boot and FIP repositories
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: Build Mainline U-Boot (jethub_j80 / GXL 792MHz DDR3)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- jethub_j80_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package and Sign FIP (u-boot.bin.sd.bin)
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          ./build-fip.sh jethub-j80 ../u-boot/u-boot.bin ../fip_output
          ls -lh ../fip_output

      - name: Download Base Armbian S905X Image and Inject U-Boot
        run: |
          set -e
          mkdir -p work
          cd work
          RELEASE_JSON=$(curl -s https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases/latest)
          IMG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | (startswith("Armbian_") and contains("_amlogic_s95x_") and endswith(".img.gz"))) | .browser_download_url' | head -n 1)
          if [ -z "$IMG_URL" ]; then
            IMG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | (startswith("Armbian_") and contains("_amlogic_s905x_") and endswith(".img.gz"))) | .browser_download_url' | head -n 1)
          fi
          if [ -z "$IMG_URL" ]; then
            echo "Error: Failed to fetch Armbian S905X image URL!"
            exit 1
          fi
          echo "Downloading: $IMG_URL"
          curl -L -o base_armbian.img.gz "$IMG_URL"
          gunzip base_armbian.img.gz

          dd if=../fip_output/u-boot.bin.sd.bin of=base_armbian.img conv=fsync,notrunc bs=1 count=442
          dd if=../fip_output/u-boot.bin.sd.bin of=base_armbian.img conv=fsync,notrunc bs=512 skip=1 seek=1

          LOOP_DEV=$(sudo losetup --show -fP base_armbian.img)
          sudo mkdir -p /mnt/armbian_boot
          sudo mount ${LOOP_DEV}p1 /mnt/armbian_boot
          if [ -f /mnt/armbian_boot/uEnv.txt ]; then
            sudo sed -i 's/FDT=.*/FDT=\/dtb\/amlogic\/meson-gxl-s905w-p281.dtb/g' /mnt/armbian_boot/uEnv.txt
          fi
          if [ -f /mnt/armbian_boot/extlinux/extlinux.conf ]; then
            sudo sed -i 's/FDT .*/FDT \/dtb\/amlogic\/meson-gxl-s905w-p281.dtb/g' /mnt/armbian_boot/extlinux/extlinux.conf
          fi
          sudo sync
          sudo umount /mnt/armbian_boot
          sudo losetup -d ${LOOP_DEV}

          BUILD_DATE=$(date +'%Y.%m.%d')
          OUTPUT_NAME="Armbian_${BUILD_DATE}_s905_p212.img.gz"
          gzip -c base_armbian.img > "../${OUTPUT_NAME}"
          rm -f base_armbian.img
          echo "OUTPUT_FILE=${OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Publish Release to s905_p281 tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905_p281
          name: "Armbian S905 GXL (792MHz DDR3 / P212) Build-北京联通Q5"
          body: |
            自动构建的 Amlogic GXL（792MHz DDR3 低频内存时序，适配 S905L/S905W/S905M2 1GB 盒子）主线 U-Boot 与 Armbian 镜像。

            ### TF 卡刷写步骤（以设备为 /dev/sda 为例）：
            ```bash
            # 1. 先将 Armbian 镜像写入 TF 卡
            zcat Armbian_xx_s905_p212.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 2. 写入自制主线 U-Boot（必须跳过前 512 字节以保留 MBR 分区表）
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 3. 同步缓存并安全弹出
            sync
            ```
          files: |
            ${{ env.OUTPUT_FILE }}
            fip_output/u-boot.bin.sd.bin
