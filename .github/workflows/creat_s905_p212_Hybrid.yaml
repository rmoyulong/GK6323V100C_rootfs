name: 构建北京联通Q5 Armbian S905 P212 (GXL 792MHz Hybrid)TF/SD卡启动镜像

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/creat_s905_p212_Hybrid.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc-aarch64-linux-gnu bison flex libssl-dev device-tree-compiler python3 curl jq gzip parted dosfstools util-linux

      - name: Clone U-Boot and FIP repositories
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: Build Mainline U-Boot (P212 Generic TV Box BL33)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p212_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Sign and Package FIP (JetHub-J80 792MHz DDR3 BL2 + P212 BL33)
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          chmod +x build-fip.sh
          ./build-fip.sh jethub-j80 ../u-boot/u-boot.bin ../fip_output
          ls -lh ../fip_output/

      - name: Download Latest S905X Armbian Base Image and Inject U-Boot
        run: |
          set -e
          BUILD_DATE=$(date +'%Y.%m.%d')
          OUTPUT_IMG="Armbian_${BUILD_DATE}_s905_p212.img"
          
          RELEASE_JSON=$(curl -s https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases/latest)
          IMG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | startswith("Armbian_") and contains("_amlogic_s905x_") and endswith(".img.gz")) | .browser_download_url' | head -n 1)
          
          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            echo "Error: Failed to fetch Armbian S905X image URL!"
            exit 1
          fi
          
          echo "Downloading: $IMG_URL"
          curl -L "$IMG_URL" -o base_armbian.img.gz
          gunzip -c base_armbian.img.gz > "$OUTPUT_IMG"
          rm -f base_armbian.img.gz

          dd if=fip_output/u-boot.bin.sd.bin of="$OUTPUT_IMG" conv=notrunc,fsync bs=1 count=442
          dd if=fip_output/u-boot.bin.sd.bin of="$OUTPUT_IMG" conv=notrunc,fsync bs=512 skip=1 seek=1

          LOOP_DEV=$(sudo losetup -fP --show "$OUTPUT_IMG")
          sudo mkdir -p /mnt/armbian_boot
          sudo mount "${LOOP_DEV}p1" /mnt/armbian_boot

          if [ -f /mnt/armbian_boot/uEnv.txt ]; then
            sudo sed -i 's|FDT=.*|FDT=/dtb/amlogic/meson-gxl-s905x-p212.dtb|' /mnt/armbian_boot/uEnv.txt
          fi
          if [ -f /mnt/armbian_boot/extlinux/extlinux.conf ]; then
            sudo sed -i 's|FDT .*|FDT /dtb/amlogic/meson-gxl-s905x-p212.dtb|' /mnt/armbian_boot/extlinux/extlinux.conf
          fi

          sudo sync
          sudo umount /mnt/armbian_boot
          sudo losetup -d "$LOOP_DEV"

          gzip -9 "$OUTPUT_IMG"
          ls -lh "${OUTPUT_IMG}.gz"

      - name: Publish Release to s905_p212_Hybrid tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905_p212_Hybrid
          name: "Armbian S905 P212 (GXL 792MHz Hybrid U-Boot)-北京联通Q5"
          body: |
            自动构建的 Amlogic GXL (S905X / S905L / S905M2) 适用 792MHz DDR3 BL2 + 普通 P212 主线 U-Boot 独立引导.

            适用于内置 eMMC/NAND 损坏的 Amlogic GXL 系列盒子，直接从外置 TF 卡冷启动主线 Armbian。
            
            ### TF 卡刷写步骤（Debian / Linux 终端，请务必确认目标设备为 `/dev/sda`）
            ```bash
            # 1. 先将 Armbian 镜像写入 TF 卡
            zcat Armbian_xx_s905_p212.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 2. 写入自制主线 U-Boot（必须跳过前 512 字节以保留 MBR 分区表）
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 3. 同步缓存并安全弹出
            sync
            ```
          files: |
            Armbian_*_s905_p212.img.gz
            fip_output/u-boot.bin.sd.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
