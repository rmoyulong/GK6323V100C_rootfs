name: GK6323V100C 内核自动构建

# ============================================================
# 本文件与 hi3798mv100 仓库的 hisi.yml 逐段同构：
#   拉源码 → 打 histb 补丁 → 部署配置并逐项自检 → 编译
#   → 编译自带设备树、追加到内核镜像、包 uImage
#   → 收模块 → 上传产物 → 发布 Release
#
# 与 hisi.yml 的差别只有 5 处，其余照搬：
#   1) ARCH=arm64，交叉工具链 aarch64-linux-gnu-
#   2) 内核是 arch/arm64/boot/Image，uImage 用 -A arm64 打包
#   3) 设备树用它自己那份（dts/gk6323v100c-chaoge-z71a.dts，逐项取自
#      真机），追加到内核镜像末尾，追加处校验魔数 d00dfeed；同时把
#      该 dtb 单独放进 Release，必须写入 dtbo 分区（/dev/mmcblk0p10）
#   4) 单板配置多一项 CONFIG_SND_USB_AUDIO=m —— 本仓库存在的理由
#   5) 刷写分区：boot = /dev/mmcblk0p15（60M，起始 112M）
#
# 基线（与 mv100 仓库逐字一致）：
#   KERNEL_VERSION = 7.4-rc3
#   BASE_SHA       = 19d1b4de6d37bccecc3ad9144d279f1baa405eb1
# 注意：下面 env 里的两个值是**兜底值**。流水线会先拉补丁库、读它自己的
# baseline 文件，以库里的值为准 —— 补丁库更新后不必再改本文件。
#
# 三点必须知道的事（详见 README）：
#   a) 这台不是海思 MV200H。真机实测为 4×Cortex-A55 + GICv3 +
#      国科私有 CRU，所以设备树用仓库自带的 gk6323v100c-chaoge-z71a.dts，
#      **不再**用补丁库里海思 A53 的 mv200h 板级 dts（用错会红灯循环重启）。
#   b) 本基线是主线内核，不是作者那版国科 BSP 内核（6.18.46-gk6323-debian）。
#      产出内核版本号因此是 7.4.x，模块装到 /lib/modules/7.4.x 下 ——
#      内核与模块必须一起替换。
#   c) 真机运行的设备树来自 dtbo 分区（作者 boot.img 内没有 dtb）。因此
#      编译出的 dtb **必须写入 dtbo 分区**才能生效；内嵌的那份是冗余备份。
# ============================================================

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/gk6323.yml'
      - 'gk6323v100c.config'
      - 'apply_histb_patches.sh'
      - 'dts/*.dts'
      - 'dts/check-dts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gk6323v100c:
    name: 编译 GK6323V100C 内核+模块
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_REPO: https://github.com/torvalds/linux.git
      # 补丁仓库（与 hi3798mv100 用同一个库；本机只取其 i2c/femac 等共用 IP 修正）
      PATCHES_REPO: https://github.com/rmoyulong/histb-mainline_patches
      # 兜底值；会被补丁库 baseline 文件里的实际值覆盖（见「拉取补丁仓库并读取基线」）
      PATCHES_BASE_SHA: 19d1b4de6d37bccecc3ad9144d279f1baa405eb1
      PATCHES_KERNEL_VERSION: 7.4-rc3
      # uImage 头内地址，与实机 boot.img 实测一致
      UIMAGE_LOADADDR: "0x02000000"
      UIMAGE_ENTRYADDR: "0x02000000"
      # 本仓库自带的板级设备树（逐项取自真机，不再用补丁库的 mv200h 板级）
      BOARD_DTS: dts/gk6323v100c-chaoge-z71a.dts
      TARGET_DTB: gk6323v100c-chaoge-z71a.dtb
      # 单板配置层
      FRAGMENT: gk6323v100c.config
      # 实机分区：boot 起始 112M、长 60M；dtbo 起始 50M、长 2M
      BOOT_PART: /dev/mmcblk0p15
      BOOT_PART_LIMIT_MB: "60"
      DTBO_PART: /dev/mmcblk0p10

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验必要文件存在
        run: |
          set -euo pipefail
          for f in apply_histb_patches.sh "$FRAGMENT" "$BOARD_DTS"; do
            [ -f "$f" ] || { echo "::error::根目录缺少 $f"; exit 1; }
          done
          chmod +x apply_histb_patches.sh
          ls -lh apply_histb_patches.sh "$FRAGMENT" "$BOARD_DTS"

      - name: 设备树静态校验（无 dtc 也能查出漏分号、label 未定义、地址不符）
        run: |
          set -euo pipefail
          python3 dts/check-dts.py "$BOARD_DTS"

      - name: 安装 ARM64 交叉编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            bc bison flex libssl-dev libncurses5-dev ccache kmod \
            u-boot-tools device-tree-compiler quilt git wget xz-utils \
            cpio rsync zstd
          aarch64-linux-gnu-gcc --version | sed -n '1p'
          dtc --version

      - name: 拉取补丁仓库并读取基线
        run: |
          set -euo pipefail
          git clone --depth 1 "$PATCHES_REPO" histb-patches
          cd histb-patches

          echo "=== 补丁库 baseline 原文 ==="
          if [ -f baseline ]; then
            cat baseline
          else
            echo "(补丁库没有 baseline 文件，沿用 workflow 里的兜底值)"
          fi

          # 兼容四种写法：KEY = v / KEY=v / "# KEY = v" / KEY := v
          #   ★ 补丁库 rc3 起用的是 "KERNEL_VERSION := 7.4-rc3"（make 写法）。
          #     只认 "=" 的正则在它上面取到空串 → 静默回落到本文件底部的兜底值，
          #     「自动读基线」于是形同失效，库里换版本也不会跟着动。
          #   ★ 末尾 || true：baseline 不存在时 sed 返回非零，否则 set -e 直接杀步骤。
          get() { sed -n "s/^[#[:space:]]*$1[[:space:]]*:*=[[:space:]]*//p" baseline 2>/dev/null | head -1 | tr -d '[:space:]' || true; }
          KV="$(get KERNEL_VERSION)"; SHA="$(get BASE_SHA)"
          [ -n "$KV" ]  || KV="$PATCHES_KERNEL_VERSION"
          [ -n "$SHA" ] || SHA="$PATCHES_BASE_SHA"

          echo "=== 本次采用的基线 ==="
          echo "KERNEL_VERSION = $KV"
          echo "BASE_SHA       = $SHA"
          echo "PATCHES_KERNEL_VERSION=$KV" >> "$GITHUB_ENV"
          echo "PATCHES_BASE_SHA=$SHA"      >> "$GITHUB_ENV"

          echo "=== 补丁库布局检查（series 或根目录平铺两种都支持）==="
          mapfile -t patches < <(find . -name '*.patch' -type f | LC_ALL=C sort -V)
          echo "补丁总数：${#patches[@]}"
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::补丁库里没有 .patch 文件"
            exit 1
          fi
          if [ -f series ]; then
            echo "存在 series，脚本将按 series 顺序应用"
          else
            echo "无 series，脚本将按文件名序号排序应用"
          fi

      - name: 拉取内核源码（基线 commit 取自补丁库 baseline）
        run: |
          set -euo pipefail
          echo "拉取内核基线：$PATCHES_KERNEL_VERSION (commit: $PATCHES_BASE_SHA)"
          git clone --filter=blob:none --no-checkout "$KERNEL_REPO" linux_build
          cd linux_build
          git checkout -q "$PATCHES_BASE_SHA"

          # 规范化：7.4.0-rc3 -> 7.4-rc3，使两种写法等价
          norm() { printf '%s' "$1" | sed -E 's/^([0-9]+\.[0-9]+)\.0/\1/'; }
          ACT="$(make -s kernelversion)"
          EXP="$PATCHES_KERNEL_VERSION"
          echo "实际内核版本：$ACT ；baseline 期望：$EXP"
          if [ "$(norm "$ACT")" != "$(norm "$EXP")" ]; then
            echo "::error::版本不匹配：期望 $EXP，实际 $ACT —— 请核对补丁库 baseline 里的 BASE_SHA 是否与 KERNEL_VERSION 配套"
            exit 1
          fi
          echo "版本校验通过：$ACT"

      - name: 应用 histb 补丁（调用仓库根目录 apply_histb_patches.sh）
        run: |
          set -euo pipefail
          cd linux_build
          # 该脚本自判：有 series 按 series，没有则按文件名序号应用全部 *.patch；
          # 等价于 quilt --fuzz=0，遇冲突即中止并回滚，不会静默产出缺补丁的内核
          PATCHES_DIR="../histb-patches" CI=true bash ../apply_histb_patches.sh -y
          echo "=== 补丁后确认 ===（本仓库设备树自带，不再要求补丁库含 mv200h 板级 dts）"
          ls arch/arm64/boot/dts/hisilicon/ | head -20 || true

      - name: 部署内核配置并强制关键驱动内置
        run: |
          set -euo pipefail
          cd linux_build

          # arm64 通用默认配置 → 叠加单板配置层 → 让 kconfig 补依赖
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" defconfig
          ./scripts/kconfig/merge_config.sh -m .config "../$FRAGMENT"

          # 说明：$FRAGMENT 本身已包含下列全部项目，这里的 scripts/config
          # 只是防止叠加过程中丢项，符号名以内核 Kconfig 为准
          scripts/config --enable ARCH_HISI
          scripts/config --enable OF
          # 中断控制器 / 定时器（真机是 GICv3 + A55，不是 GIC-400 + A53）
          scripts/config --enable ARM_GIC
          scripts/config --enable ARM_GIC_V3
          scripts/config --enable ARM_ARCH_TIMER
          # 控制台串口
          scripts/config --enable SERIAL_AMBA_PL011
          scripts/config --enable SERIAL_AMBA_PL011_CONSOLE
          # eMMC：(设备树追加 "snps,dw-mshc") → pltfm + dw
          scripts/config --enable MMC
          scripts/config --enable MMC_BLOCK
          scripts/config --enable MMC_DW
          scripts/config --enable MMC_DW_PLTFM
          # 根文件系统（NLS 是 NLS_CODEPAGE_* 的父符号）
          scripts/config --enable EXT4_FS
          scripts/config --enable NLS
          # 命令行分区表：本机 root= 与全部 18 个分区都由 bootargs 里的
          # blkdevparts= 下发
          # ★ 必须先开父菜单 PARTITION_ADVANCED：CMDLINE_PARTITION 的 prompt
          #   条件是 "if PARTITION_ADVANCED"，父项为 n 时它成了无 prompt 符号，
          #   这一行会被 olddefconfig 丢弃，构建随后停在「必须项」一节
          scripts/config --enable PARTITION_ADVANCED
          scripts/config --enable MSDOS_PARTITION
          scripts/config --enable CMDLINE_PARTITION
          # 板载百兆网口（★ 同样先开父菜单 NET_VENDOR_HISILICON，并带上 PHYLIB）
          scripts/config --enable PHYLIB
          scripts/config --enable OF_MDIO
          scripts/config --enable NET_VENDOR_HISILICON
          scripts/config --enable HISI_FEMAC
          scripts/config --enable MDIO_HISI_FEMAC
          scripts/config --enable HISI_FESTA_PHY
          # I2C / GPIO / SPI / RTC / 看门狗 / 帧缓冲
          scripts/config --enable I2C
          scripts/config --enable I2C_HIX5HD2
          scripts/config --enable GPIOLIB
          scripts/config --enable GPIO_PL061
          scripts/config --enable SPI
          scripts/config --enable SPI_PL022
          scripts/config --enable RTC_CLASS
          scripts/config --enable RTC_DRV_PCF8563
          scripts/config --enable WATCHDOG
          scripts/config --enable ARM_SP805_WATCHDOG
          scripts/config --enable FB
          scripts/config --enable FB_SIMPLE
          # USB 主控（本板设备树里只有 EHCI/OHCI，无 xhci）
          # ★ PHY_HISI_INNO_USB2 的父符号
          scripts/config --enable GENERIC_PHY
          scripts/config --enable USB_PHY
          scripts/config --enable USB_EHCI_HCD
          scripts/config --enable USB_EHCI_HCD_PLATFORM
          scripts/config --enable USB_OHCI_HCD
          scripts/config --enable USB_OHCI_HCD_PLATFORM
          scripts/config --enable PHY_HISI_INNO_USB2
          scripts/config --enable USB_STORAGE
          # ALSA 骨架：SND_PCM / SND_TIMER 是**无 prompt 符号**，取值只由 select 决定，
          # 在这里 --enable 也会被 olddefconfig 重算，故不写（见 gk6323v100c.config 附录）。
          # ★ 本仓库存在的理由：USB 声卡 / USB DAC
          scripts/config --enable SND_USB
          # ★ 这里必须用 --module，不能用 --enable：--enable 对 tristate 符号等于设成 y，
          #   会顶掉叠加层里的 =m，把 USB 音频编成内置，产物形态就不再是「内核 + 模块」，
          #   逐行自检还会报「叠加层未生效：CONFIG_SND_USB_AUDIO=m」。SND_USB 是 bool，用 --enable 正确。
          scripts/config --module SND_USB_AUDIO
          # 模块支持：作者那版是纯内置内核（/proc/modules 不存在）
          scripts/config --enable MODULES
          scripts/config --enable MODULE_UNLOAD
          # 启动参数交给 bootargs 分区传，不在内核里写死 root=
          scripts/config --set-str CMDLINE ""

          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          echo "=== 必须项：少一项这台机器就起不来或目标落空，直接中止 ==="
          for s in ARCH_HISI ARM_GIC_V3 ARM_ARCH_TIMER SERIAL_AMBA_PL011_CONSOLE \
                   MMC_BLOCK MMC_DW_PLTFM \
                   EXT4_FS PARTITION_ADVANCED CMDLINE_PARTITION \
                   NET_VENDOR_HISILICON PHYLIB HISI_FEMAC \
                   USB_EHCI_HCD PHY_HISI_INNO_USB2 MODULES; do
            if grep -qE "^CONFIG_${s}=[ym]$" .config; then
              echo "OK   $(grep -E "^CONFIG_${s}=" .config)"
            else
              echo "::error::CONFIG_$s 未开启 —— 若该符号被 if 包住，请先确认它的父菜单已开启（见 docs/troubleshooting.md 构建阶段第 4 条）"
              exit 1
            fi
          done

          # USB 音频是本仓库存在的理由，单独硬校验，形态与 mv100 一致（=m）
          if grep -qE '^CONFIG_SND_USB_AUDIO=m$' .config; then
            echo "OK   $(grep -E '^CONFIG_SND_USB_AUDIO=' .config)"
          elif grep -qE '^CONFIG_SND_USB_AUDIO=y$' .config; then
            echo "OK   $(grep -E '^CONFIG_SND_USB_AUDIO=' .config)（内置）"
            echo "::warning::USB 音频被编成了内置（=y），modules.tar.gz 里不会有 snd-usb-audio.ko"
            echo "::warning::要保持「内核 + 模块」形态，把本步骤里的 --enable SND_USB_AUDIO 改回 --module SND_USB_AUDIO"
          else
            echo "::error::CONFIG_SND_USB_AUDIO 未开启，USB 声卡会用不了"
            exit 1
          fi

          # 统一的安全取值：grep 无命中时给空串，且不返回非零
          #   ★ 本步骤开着 set -euo pipefail。写成
          #       CUR="$(grep … | head -1)"
          #     时，若该符号在 .config 里「一行都没有」，grep 返回 1，pipefail 把整条
          #     管道带成非零，这个赋值命令就失败 —— set -e 立刻杀掉整个步骤：不打
          #     警告、不打诊断，日志里只剩 "Process completed with exit code 1"。
          #     这正是 2026-11-18 那次构建停在「期望项」第 7 项（HISI_FESTA_PHY）且
          #     全无输出的原因。凡是从 .config 取一行，一律走 lookup()。
          lookup() { grep -E "$1" .config 2>/dev/null | head -1 || true; }
          kdef()   { grep -rn -A8 "^config $1\$" --include='Kconfig*' . 2>/dev/null | head -12 || true; }

          # 报「未生效」时，把该符号在本次内核树里的 Kconfig 定义打出来：
          # 一眼能看出是被 if 包住（父项没开）、依赖未满足，还是被改名/删除。
          show_kconfig() {
            local sym="$1" blk
            blk="$(kdef "$sym")"
            if [ -n "$blk" ]; then
              echo "  └─ Kconfig 定义："
              printf '%s\n' "$blk" | sed 's/^/     /'
            else
              echo "  └─ 本次内核树里找不到该符号的 Kconfig 定义 —— 很可能被改名或删除了"
            fi
          }

          echo "=== 期望项：没生效只告警（可能依赖未满足或被改名）==="
          for s in OF SERIAL_AMBA_PL011 \
                   MMC MMC_DW \
                   OF_MDIO MDIO_HISI_FEMAC \
                   GENERIC_PHY USB_PHY \
                   USB_EHCI_HCD_PLATFORM USB_OHCI_HCD USB_OHCI_HCD_PLATFORM USB_STORAGE \
                   I2C_HIX5HD2 GPIO_PL061 SPI_PL022 RTC_DRV_PCF8563 ARM_SP805_WATCHDOG \
                   FB_SIMPLE \
                   SND SND_USB \
                   NLS NLS_UTF8 NLS_CODEPAGE_936; do
            if grep -qE "^CONFIG_${s}=[ym]$" .config; then
              echo "OK   $(grep -E "^CONFIG_${s}=" .config)"
            else
              CUR="$(lookup "^(CONFIG_${s}=|# CONFIG_${s} is not set)")"
              if [ -z "$CUR" ]; then
                echo "::warning::CONFIG_$s 在 .config 里一行都没有 —— 该符号不在本次内核树中（补丁未提供／已被改名／已随补丁库版本移除），写在叠加层也无处落地"
              else
                echo "::warning::CONFIG_$s 未生效（当前值：$CUR）"
              fi
              show_kconfig "$s"
            fi
          done

          echo "=== 已移除符号报告（补丁库 rc3 起不再提供，仅报告不判失败）==="
          # HISI_FESTA_PHY：旧补丁库由 pending-7.4/210-01 提供该 PHY 驱动，
          #   rc3 版重构清单后，整库 126 个补丁里已无一提及 Festa PHY。
          #   因此它在 7.4-rc3 内核树里不存在，叠加层写它必然被 olddefconfig 丢弃。
          #   本板网口的 PHY 只能另想办法（hisilicon,hisi-femac-v2 自带或固定链路），
          #   留待网口阶段处理；这里只报告，不判失败。
          for s in HISI_FESTA_PHY; do
            CUR="$(lookup "^(CONFIG_${s}=|# CONFIG_${s} is not set)")"
            if [ -n "$CUR" ]; then
              echo "    $s：$CUR"
            else
              echo "    $s：不在 .config 中 —— 内核树无此符号"
              show_kconfig "$s"
            fi
          done

          echo "=== 派生符号报告（无 prompt / 由 select 决定，写进叠加层也无效，仅报告不判失败）==="
          for s in ARM_GIC_V3 ARM_GIC_V3_ITS SND_PCM SND_TIMER SND_HWDEP SND_RAWMIDI SND_SOC MDIO_DEVICE; do
            V="$(lookup "^(CONFIG_${s}=|# CONFIG_${s} is not set)")"
            printf '    %-22s %s\n' "$s" "${V:-（不在 .config 中）}"
          done

          if ! grep -qE '^CONFIG_CMDLINE=""$' .config; then
            echo "::error::CONFIG_CMDLINE 不是空串，启动参数应与 bootargs 分区一致"
            exit 1
          fi

          echo "=== 单板配置层逐行自检（未生效的逐条列出）==="
          # 本文件只应出现「有 prompt 的符号」；无 prompt 符号（SND_PCM、SND_TIMER、
          # ARM_GIC_V3_ITS 等）写了必然被 olddefconfig 重算，已从本文件移除。
          grep '^CONFIG_' "../$FRAGMENT" > /tmp/board.want
          MISS=0
          while read -r line; do
            case "$line" in
              CONFIG_CMDLINE=*) continue ;;
            esac
            sym="${line%%=*}"; sym="${sym#CONFIG_}"
            # tristate 符号的 m 可能被 select 提升为 y（属正常，不是丢项），
            # 因此以 =m 结尾的行按 [ym] 判定，其余行仍逐字节严格比对。
            case "$line" in
              *=m)
                key="${line%=m}"
                if ! grep -qE "^${key}=[ym]$" .config; then
                  echo "::warning::叠加层未生效：$line（期望 m，实际 $(lookup "^${key}=")）"
                  show_kconfig "$sym"
                  MISS=$((MISS + 1))
                fi
                ;;
              *)
                if ! grep -qxF "$line" .config; then
                  CUR="$(lookup "^(CONFIG_${sym}=|# CONFIG_${sym} is not set)")"
                  if [ -z "$CUR" ]; then
                    echo "::warning::叠加层未生效：$line（该符号在 .config 里一行都没有 —— 不在本次内核树中）"
                  else
                    echo "::warning::叠加层未生效：$line（当前值：$CUR）"
                  fi
                  show_kconfig "$sym"
                  MISS=$((MISS + 1))
                fi
                ;;
            esac
          done < /tmp/board.want
          echo "叠加层未生效行数：$MISS"
          echo "=== 最终内核版本 ==="
          make -s ARCH="$ARCH" kernelrelease

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: "${{ runner.os }}-ccache-${{ env.KERNEL_VERSION }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KERNEL_VERSION }}-
            ${{ runner.os }}-ccache-
            
      - name: 编译内核与模块
        run: |
          set -euo pipefail
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j"$(nproc)" ARCH="$ARCH" CROSS_COMPILE="ccache $CROSS_COMPILE" Image
          make -j"$(nproc)" ARCH="$ARCH" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 编译仓库自带的 GK6323V100C 设备树
        run: |
          set -euo pipefail
          OUT="linux_build/arch/arm64/boot/dts/hisilicon/$TARGET_DTB"
          mkdir -p "$(dirname "$OUT")"
          # 优先用内核树自带的 dtc（与内核同源），没有则用系统 dtc
          DTC="linux_build/scripts/dtc/dtc"
          [ -x "$DTC" ] || DTC="$(command -v dtc || true)"
          [ -n "$DTC" ] || { echo "::error::找不到 dtc（内核树与系统里都没有）"; exit 1; }
          echo "使用 dtc：$DTC"
          "$DTC" -@ -I dts -O dtb -o "$OUT" "$BOARD_DTS"
          echo "=== 反编译回读关键项，确认编译结果与真机一致 ==="
          "$DTC" -I dtb -O dts "$OUT" > /tmp/rt.dts
          for k in "arm,cortex-a55" "arm,gic-v3" "arm,pl011" "snps,dw-mshc" "gk6323v100c"; do
            if grep -q "$k" /tmp/rt.dts; then
              echo "OK   $k"
            else
              echo "::error::编译后的 dtb 缺少 $k"
              exit 1
            fi
          done
          ls -l "$OUT"

      - name: 追加设备树并打包 uImage
        run: |
          set -euo pipefail
          cd linux_build
          IMG=arch/arm64/boot/Image
          DTB="arch/arm64/boot/dts/hisilicon/$TARGET_DTB"
          if [ ! -f "$DTB" ]; then
            echo "::error::设备树不存在: $DTB"
            exit 1
          fi

          cat "$IMG" "$DTB" > Image-dtb

          ISIZE=$(stat -c%s "$IMG")
          DTBSIZE=$(stat -c%s "$DTB")
          MAGIC=$(dd if=Image-dtb bs=1 skip="$ISIZE" count=4 2>/dev/null | od -A n -t x1 | tr -d ' \n\t')
          echo "Image=$ISIZE 字节, dtb=$DTBSIZE 字节, 追加处魔数=$MAGIC"
          if [ "$MAGIC" != "d00dfeed" ]; then
            echo "::error::设备树追加位置错误，魔数不是 d00dfeed"
            exit 1
          fi

          mkimage -A arm64 -O linux -T kernel -C none \
            -a "$UIMAGE_LOADADDR" -e "$UIMAGE_ENTRYADDR" \
            -n "GK6323V100C Linux $PATCHES_KERNEL_VERSION" \
            -d Image-dtb arch/arm64/boot/boot.img

          echo "=== uImage 头信息 ==="
          mkimage -l arch/arm64/boot/boot.img
          SIZE=$(stat -c%s arch/arm64/boot/boot.img)
          LIMIT=$((BOOT_PART_LIMIT_MB * 1024 * 1024))
          echo "boot.img 总大小：$SIZE 字节（boot 分区上限 $LIMIT 字节）"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::boot.img 超过 boot 分区上限，不可刷入"
            exit 1
          fi

      - name: 整理产物
        run: |
          set -euo pipefail
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s ARCH="$ARCH" kernelrelease)"
          cp arch/arm64/boot/boot.img out/boot.img
          cp arch/arm64/boot/Image out/Image
          # 单独发一份 dtb：真机运行时的设备树来自 dtbo 分区，这一份必须写入 p10
          cp "arch/arm64/boot/dts/hisilicon/$TARGET_DTB" out/
          cp .config "out/config-$KREL"
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          # 生成校验清单，便于上机前后核对
          cd out
          sha256sum boot.img modules.tar.gz Image "$TARGET_DTB" "config-$KREL" > sha256sums.txt
          cat sha256sums.txt
          echo "内核 release: $KREL"
          echo "=== 产物列表 ==="
          ls -lh

      - name: 生成发布说明
        run: |
            cat > linux_build/RELEASE_NOTES.md <<EOF
            # GK6323V100C 内核 ${KREL}

            面向国科微 GK6323V100C 机顶盒（真机 4×Cortex-A55 + GICv3，ARM64）的自编译内核。

            ## 说明文本

            - 内核基线：Linux ${KREL}（与 hi3798mv100 仓库同一 pin），按补丁库 baseline 提取工作树
            - 补丁来源：histb-mainline_patches，严格应用（等价 --fuzz=0），冲突即回滚
            - 设备树：${TARGET_DTB}，逐项取自真机导出的设备树（A55 / GICv3 / 国科专有 IP 全部对齐）
            - 内核配置：仓库 gk6323v100c.config；串口、eMMC、ext4、命令行分区表均编入内核（=y）
            - 关键项：CONFIG_SND_USB_AUDIO —— 作者那版 BSP 内核没有编入，USB 声卡因此不出声
            - 该驱动形态与 mv100 的 kernel.config 一致（=m），所以必须先把模块解开再重启
            - 模块支持：CONFIG_MODULES=y，作者那版是纯内置内核（/proc/modules 不存在）
            - 镜像格式：uImage，-A arm64，不压缩（-C none），加载/入口地址 ${UIMAGE_LOADADDR}
            - 设备树同时追加在内核镜像末尾（追加处校验魔数 d00dfeed）并单独发布
            - 本内核版本号是 ${KREL}，与作者那版 6.18.46-gk6323-debian 不同，
              模块会装到 /lib/modules/${KREL} 下，内核与模块必须一起替换

            ## 产物

            | 文件 | 用途 |
            | --- | --- |
            | boot.img | 内核镜像（uImage，内嵌设备树），写入 ${BOOT_PART} |
            | ${TARGET_DTB} | 设备树，**必须**写入 ${DTBO_PART}（真机运行时用的是这个分区的 dtb） |
            | modules.tar.gz | 内核模块，解压到根目录 / |
            | Image | 未打包的裸内核，仅供核对 |
            | config-${KREL} | 本次实际使用的内核配置 |
            | sha256sums.txt | 上述产物的校验值 |

            ## 刷写步骤（顺序不可颠倒）

            1. 把 boot.img、${TARGET_DTB}、modules.tar.gz 传到机器 /tmp 目录
            2. 先备份：dd if=${BOOT_PART} of=/root/boot.bak bs=1M conv=fsync
            3. 先装模块：cd / && tar -xzf /tmp/modules.tar.gz && sync
            4. 刷内核：dd if=/tmp/boot.img of=${BOOT_PART} bs=1M conv=fsync && sync
            5. 刷设备树：dd if=/tmp/${TARGET_DTB} of=${DTBO_PART} bs=1K conv=fsync && sync
            6. 等待数秒后 reboot

            ## 回滚

            若启动异常（指示灯异常闪烁、TTL 无输出），用备份镜像写回：

            dd if=/root/boot.bak of=${BOOT_PART} bs=1M conv=fsync && sync && reboot

            注意：本次同时改写了 dtbo 分区。回滚内核不会恢复原来的设备树，
            若手上有原机 dtbo.img，请一并写回 ${DTBO_PART}。

            校验值见 sha256sums.txt，上机前建议先在电脑上比对一次。
            EOF
          
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        
        with:
          tag_name: GK6323V100C_latest
          body_path: linux_build/RELEASE_NOTES.md
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          files: |
            linux_build/out/*