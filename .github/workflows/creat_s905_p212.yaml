name: 构建北京联通Q7 Armbian S905  (GXL P212) TF/SD内置卡槽启动镜像

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/creat_s905_p212.yaml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc-aarch64-linux-gnu bison flex libssl-dev device-tree-compiler python3 curl jq parted kpartx

      - name: Clone U-Boot and Amlogic FIP tools
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: Build and Sign Mainline U-Boot for P212 (GXL)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p212_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          cd ..

          mkdir -p fip_output
          cd amlogic-boot-fip
          ./build-fip.sh p212 ../u-boot/u-boot.bin ../fip_output
          cd ..

          ls -la fip_output/
          cp fip_output/u-boot.bin.sd.bin ./u-boot.bin.sd.bin

      - name: Download Latest Armbian S905X Base Image
        run: |
          mkdir -p armbian_build
          cd armbian_build
          # Fetch latest S905X (GXL) Armbian image URL from ophub releases
          IMG_URL=$(curl -sL https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases/latest | jq -r '.assets[] | select(.name | test("Armbian_.*_amlogic_s905x_.*\\.img\\.gz$")) | .browser_download_url' | head -n 1)
          echo "Downloading: $IMG_URL"
          curl -L -o base_armbian.img.gz "$IMG_URL"
          gunzip base_armbian.img.gz

      - name: Inject P212 Mainline U-Boot and Configure DTB
        run: |
          cd armbian_build
          # Write GXL P212 U-Boot into image while preserving MBR partition table
          dd if=../u-boot.bin.sd.bin of=base_armbian.img conv=notrunc,fsync bs=1 count=442
          dd if=../u-boot.bin.sd.bin of=base_armbian.img conv=notrunc,fsync bs=512 skip=1 seek=1

          # Mount boot partition with sudo and set DTB to meson-gxl-s905x-p212.dtb
          LOOP_DEV=$(sudo losetup --find --show --partscan base_armbian.img)
          sudo mkdir -p /mnt/armbian_boot
          sudo mount "${LOOP_DEV}p1" /mnt/armbian_boot

          if [ -f /mnt/armbian_boot/uEnv.txt ]; then
            sudo sed -i 's|FDT=.*|FDT=/dtb/amlogic/meson-gxl-s905x-p212.dtb|g' /mnt/armbian_boot/uEnv.txt
          fi
          if [ -f /mnt/armbian_boot/extlinux/extlinux.conf ]; then
            sudo sed -i 's|FDT .*|FDT /dtb/amlogic/meson-gxl-s905x-p212.dtb|g' /mnt/armbian_boot/extlinux/extlinux.conf
          fi

          sudo sync
          sudo umount /mnt/armbian_boot
          sudo losetup -d "$LOOP_DEV"

          BUILD_DATE=$(date +%Y.%m.%d)
          OUT_NAME="Armbian_${BUILD_DATE}_s905_p212.img"
          mv base_armbian.img "../${OUT_NAME}"
          cd ..
          gzip -9 "${OUT_NAME}"

      - name: Publish Release to s905_p212 tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905_p212
          name: "Armbian S905 P212 (GXL) Mainline U-Boot Build -北京联通Q7"
          body: |
            ### Amlogic GXL (P212 / S905X / S905L) 主线 U-Boot 独立引导镜像-北京联通Q7

            适用于内置 eMMC/NAND 损坏的 Amlogic GXL 系列盒子，直接从外置 TF 卡冷启动主线 Armbian。

            #### TF 卡刷写步骤（Debian / Ubuntu 终端）
            请先通过 `lsblk` 确认你的 TF 卡设备名（以下以 `/dev/sda` 为例，**切勿选错系统硬盘**）：

            ```bash
            # 1. 先将 Armbian 镜像写入 TF 卡
            zcat Armbian_xx_s905_p212.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 2. 写入自制主线 U-Boot（必须跳过前 512 字节以保留 MBR 分区表）
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 3. 同步缓存并安全弹出
            sync
            ```
          files: |
            Armbian_*_s905_p212.img.gz
            u-boot.bin.sd.bin
