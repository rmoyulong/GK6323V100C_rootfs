name: 构建北京联通Q5 Armbian S905L/P212 (GXL 792MHz 低内存引导 + Trixie Rootfs)音乐服务器

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/creat_s905L_LMS.yaml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 编译 GXL 混合主线 U-Boot 并生成自定义 Rootfs 低内存引导镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 安装交叉编译链与镜像处理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-aarch64-linux-gnu \
            bison flex libssl-dev device-tree-compiler \
            python3 python3-dev swig bc u-boot-tools \
            curl jq parted kpartx dosfstools e2fsprogs util-linux

      - name: 克隆相关源码仓库
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: 编译主线 U-Boot (GXL P212 通用电视盒子配置)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p212_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 使用 JetHub-J80 (792MHz DDR3) BL2 签名封装 FIP 引导
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          chmod +x build-fip.sh
          ./build-fip.sh jethub-j80 ../u-boot/u-boot.bin ../fip_output
          cd ..
          ls -lh fip_output/u-boot.bin.sd.bin

      - name: 下载 Armbian S905X 基础镜像与 Trixie Rootfs
        run: |
          mkdir -p work_img
          cd work_img
          
          IMG_URL=$(curl -sL https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases/latest | jq -r '.assets[] | select(.name | test("Armbian_.*_amlogic_s905x_.*\\.img\\.gz$")) | .browser_download_url' | head -n 1)
          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            echo "错误：未能获取到 Armbian S905X 基础镜像下载链接！"
            exit 1
          fi
          curl -L "$IMG_URL" -o base_armbian.img.gz
          gunzip -c base_armbian.img.gz > armbian_s905_p212.img

          ROOTFS_URL="https://github.com/rmoyulong/GK6323V100C_rootfs/releases/download/arm64-rootfs-trixie-latest/rootfs.tar.gz"
          curl -L "$ROOTFS_URL" -o rootfs.tar.gz

      - name: 动态扩容、替换 Rootfs 并注入 U-Boot
        run: |
          set -e
          cd work_img

          # 1. 解压并计算容量（解压大小 + 150MB）
          sudo mkdir -p /mnt/new_rootfs_extract
          sudo tar -xpf rootfs.tar.gz -C /mnt/new_rootfs_extract
          EXTRACTED_MB=$(sudo du -sm /mnt/new_rootfs_extract | awk '{print $1}')
          TARGET_ROOTFS_MB=$((EXTRACTED_MB + 150))
          echo "Rootfs 解压大小: ${EXTRACTED_MB}MB，目标分区大小: ${TARGET_ROOTFS_MB}MB"

          P2_START_SECTOR=$(parted -ms armbian_s905_p212.img unit s print | awk -F: '$1=="2"{gsub(/s/,"",$2); print $2}')
          CURRENT_P2_MB=$(parted -ms armbian_s905_p212.img unit MB print | awk -F: '$1=="2"{gsub(/MB/,"",$4); printf "%.0f", $4}')

          if [ "$CURRENT_P2_MB" -lt "$TARGET_ROOTFS_MB" ]; then
            ADD_MB=$((TARGET_ROOTFS_MB - CURRENT_P2_MB + 20))
            echo "正在扩容镜像 (+${ADD_MB}MB)..."
            dd if=/dev/zero bs=1M count="$ADD_MB" >> armbian_s905_p212.img
            sudo parted -s armbian_s905_p212.img rm 2
            sudo parted -s armbian_s905_p212.img unit s mkpart primary ext4 "${P2_START_SECTOR}s" 100%
          fi

          # 2. 写入 792MHz 主线 U-Boot
          dd if=../fip_output/u-boot.bin.sd.bin of=armbian_s905_p212.img conv=notrunc,fsync bs=1 count=442
          dd if=../fip_output/u-boot.bin.sd.bin of=armbian_s905_p212.img conv=notrunc,fsync bs=512 skip=1 seek=1

          # 3. 关联循环设备并备份原 S905X 内核模块与固件
          LOOP_DEV=$(sudo losetup --find --show --partscan armbian_s905_p212.img)
          OLD_ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP_DEV}p2")
          OLD_ROOT_LABEL=$(sudo blkid -s LABEL -o value "${LOOP_DEV}p2" || echo "armbi_root")
          [ -z "$OLD_ROOT_LABEL" ] && OLD_ROOT_LABEL="armbi_root"

          sudo mkdir -p /mnt/old_rootfs /mnt/target_rootfs /mnt/armbian_boot /tmp/s905_kernel_backup
          sudo mount "${LOOP_DEV}p2" /mnt/old_rootfs
          [ -d /mnt/old_rootfs/lib/modules ] && sudo cp -a /mnt/old_rootfs/lib/modules /tmp/s905_kernel_backup/
          [ -d /mnt/old_rootfs/lib/firmware ] && sudo cp -a /mnt/old_rootfs/lib/firmware /tmp/s905_kernel_backup/
          sudo umount /mnt/old_rootfs

          # 4. 格式化第二分区并写入预置的 Trixie Rootfs
          sudo mkfs.ext4 -F -O ^metadata_csum_seed -L "$OLD_ROOT_LABEL" -U "$OLD_ROOT_UUID" "${LOOP_DEV}p2"
          sudo mount "${LOOP_DEV}p2" /mnt/target_rootfs
          sudo cp -a /mnt/new_rootfs_extract/. /mnt/target_rootfs/

          # 合并 S905X 内核模块与固件
          sudo mkdir -p /mnt/target_rootfs/lib
          if [ -d /tmp/s905_kernel_backup/modules ]; then
            sudo rm -rf /mnt/target_rootfs/lib/modules
            sudo cp -a /tmp/s905_kernel_backup/modules /mnt/target_rootfs/lib/
          fi
          if [ -d /tmp/s905_kernel_backup/firmware ]; then
            sudo mkdir -p /mnt/target_rootfs/lib/firmware
            sudo cp -rn /tmp/s905_kernel_backup/firmware/* /mnt/target_rootfs/lib/firmware/ 2>/dev/null || true
          fi

          # 启用 Amlogic 串口终端登录 (ttyAML0)
          sudo mkdir -p /mnt/target_rootfs/etc/systemd/system/getty.target.wants
          if [ -f /mnt/target_rootfs/usr/lib/systemd/system/serial-getty@.service ]; then
            sudo ln -sf /usr/lib/systemd/system/serial-getty@.service \
              /mnt/target_rootfs/etc/systemd/system/getty.target.wants/serial-getty@ttyAML0.service
          elif [ -f /mnt/target_rootfs/lib/systemd/system/serial-getty@.service ]; then
            sudo ln -sf /lib/systemd/system/serial-getty@.service \
              /mnt/target_rootfs/etc/systemd/system/getty.target.wants/serial-getty@ttyAML0.service
          fi

          # 更新 /etc/fstab
          sudo mount "${LOOP_DEV}p1" /mnt/armbian_boot
          BOOT_UUID=$(sudo blkid -s UUID -o value "${LOOP_DEV}p1")
          sudo bash -c "cat > /mnt/target_rootfs/etc/fstab <<EOF
          UUID=${OLD_ROOT_UUID} / ext4 defaults,noatime,nodiratime,commit=600,errors=remount-ro 0 1
          UUID=${BOOT_UUID} /boot vfat defaults 0 2
          tmpfs /tmp tmpfs defaults,nosuid 0 0
          EOF"

          # 5. 配置 512MB 低内存 extlinux.conf
          [ -f /mnt/armbian_boot/boot.scr ] && sudo mv /mnt/armbian_boot/boot.scr /mnt/armbian_boot/boot.scr.bak
          KERNEL_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uImage|zImage|vmlinuz)' | head -n 1)
          INITRD_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uInitrd|initrd)' | head -n 1)

          sudo mkdir -p /mnt/armbian_boot/extlinux
          sudo bash -c "cat > /mnt/armbian_boot/extlinux/extlinux.conf <<EOF
          LABEL Armbian
            LINUX /${KERNEL_FILE}
            INITRD /${INITRD_FILE}
            FDT /dtb/amlogic/meson-gxl-s905x-p212.dtb
            APPEND root=UUID=${OLD_ROOT_UUID} rootflags=data=writeback rw console=ttyAML0,115200n8 console=tty0 no_console_suspend consoleblank=0 fsck.fix=yes fsck.repair=yes net.ifnames=0
          EOF"

          # 6. 卸载与校验
          sudo sync
          sudo umount /mnt/armbian_boot
          sudo umount /mnt/target_rootfs
          sudo e2fsck -fy "${LOOP_DEV}p2"
          sudo losetup -d "${LOOP_DEV}"
          sudo rm -rf /mnt/new_rootfs_extract /tmp/s905_kernel_backup rootfs.tar.gz base_armbian.img.gz

          BUILD_DATE=$(date +%Y.%m.%d)
          OUT_NAME="Armbian_${BUILD_DATE}_s905_p212_trixie.img.gz"
          gzip -c armbian_s905_p212.img > "../${OUT_NAME}"
          rm -f armbian_s905_p212.img
          cd ..
          ls -lh "${OUT_NAME}"

      - name: 发布构建产物至 s905L_p212_LMS 标签
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905L_p212_LMS
          name: Armbian S905L/P212 (GXL 792MHz 低内存引导版) - 北京联通Q5自用LMS音乐服务器
          body: |
            针对北京联通 Q5 (Amlogic GXL S905L / P212) 的 Armbian 自动化构建，集成 792MHz DDR3 BL2 + 主线 U-Boot 2024.01、低内存 `extlinux.conf` 引导配置及 `ext4` 根分区预修复。

            ### TF 卡刷写说明 (Debian/Linux)
            ```bash
            # 1. 将完整的 Armbian 镜像（已包含 U-Boot、低内存 extlinux.conf 与预修复根分区）写入 TF 卡
            zcat Armbian_xx_s905_p212.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 2. （可选）单独重新写入主线 U-Boot（保留 MBR 分区表）
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 3. 同步缓存并安全弹出
            sync
            ```
          files: |
            Armbian_*_s905_p212_trixie.img.gz
            fip_output/u-boot.bin.sd.bin
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
