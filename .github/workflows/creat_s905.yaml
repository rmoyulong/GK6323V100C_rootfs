name: 构建江苏联通Q5 Armbian S905/S905M (GXBB P201)TF/SD内置卡槽启动镜像

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/creat_s905.yaml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-aarch64-linux-gnu \
            bison flex libssl-dev device-tree-compiler \
            python3 xxd parted dosfstools curl jq p7zip-full xz-utils

      - name: Clone U-Boot and FIP repositories
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: Compile Mainline U-Boot for P201 (GXBB)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p201_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package and Sign U-Boot FIP via build-fip.sh
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          ./build-fip.sh p201 ../u-boot/u-boot.bin ../fip_output
          ls -lh ../fip_output/

      - name: Download Latest Armbian S905 Base Image
        run: |
          mkdir -p work_img
          cd work_img
          # Fetch latest S905X (GXL) Armbian image URL from ophub releases
            #IMG_URL=$(curl -sL "https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases?per_page=10" \
            IMG_URL=$(curl -sL "https://github.com/rmoyulong/amlogic-s9xxx-armbian/releases/latest?per_page=1" \
              | jq -r '.[] 
                | select(.tag_name | test("trixie"; "i")) 
                | .assets[] 
                | select(.name | test("Armbian_.*_amlogic_s905x_trixie_.*\\.img\\.gz$")) 
                | .browser_download_url' \
              | head -n 1)
              
            echo $IMG_URL
          
          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            echo "错误：未能获取到 Armbian S905X 基础镜像下载链接！"
            exit 1
          fi
          
          echo "正在下载基础镜像: $IMG_URL"
          curl -L "$IMG_URL" -o base_armbian.img.gz
          
          echo "正在解压基础镜像..."
          gunzip -c base_armbian.img.gz > base_armbian.img
          
      - name: Inject P212 Mainline U-Boot and Configure DTB
        run: |
          mkdir -p work_img
          cd work_img

          # 写入自制主线 U-Boot（保留前 442 字节 MBR 引导代码与分区表）
          dd if=../fip_output/u-boot.bin.sd.bin of=base_armbian.img conv=fsync,notrunc bs=1 count=442
          dd if=../fip_output/u-boot.bin.sd.bin of=base_armbian.img conv=fsync,notrunc bs=512 skip=1 seek=1

          # 挂载 BOOT 分区并将默认设备树修改为 meson-gxbb-p201.dtb
          LOOP_DEV=$(sudo losetup --show -fP base_armbian.img)
          
          # 在打包阶段提前修复 ext4 块位图与 inode 校验和，并禁用首次开机延迟初始化，彻底避免 ext4lazyinit 报错
          echo "正在对 ROOT 分区 (${LOOP_DEV}p2) 执行 e2fsck 预校验与修复..."
          sudo e2fsck -fy "${LOOP_DEV}p2" || true
          sudo tune2fs -O ^metadata_csum_seed "${LOOP_DEV}p2" 2>/dev/null || true
          sudo e2fsck -fy "${LOOP_DEV}p2"
          
          mkdir -p mnt_boot
          sudo mount "${LOOP_DEV}p1" mnt_boot

          if [ -f mnt_boot/uEnv.txt ]; then
            sudo sed -i 's|FDT=/dtb/amlogic/.*\.dtb|FDT=/dtb/amlogic/meson-gxbb-p201.dtb|g' mnt_boot/uEnv.txt
          fi
          if [ -f mnt_boot/extlinux/extlinux.conf ]; then
            sudo sed -i 's|FDT /dtb/amlogic/.*\.dtb|FDT /dtb/amlogic/meson-gxbb-p201.dtb|g' mnt_boot/extlinux/extlinux.conf
          fi

          sync
          sudo umount mnt_boot
          sudo losetup -d "$LOOP_DEV"

          # 重新命名并压缩为目标产物
          BUILD_DATE=$(date +%Y.%m.%d)
          OUT_NAME="Armbian_${BUILD_DATE}_s905_p201.img"
          mv base_armbian.img "$OUT_NAME"
          gzip -9 "$OUT_NAME"
          mv "${OUT_NAME}.gz" ../

      - name: Publish Release to s905_p201 tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905_p201
          name: "Armbian S905 P201 Mainline U-Boot Build-江苏联通Q5"
          body: |
            自动构建的 Amlogic S905 / S905M (GXBB P201) 主线 U-Boot 固件与 Armbian 镜像。           

            适用于内置 eMMC/NAND 损坏的 Amlogic GXBB 系列盒子，直接从外置 TF 卡冷启动主线 Armbian。

            ### TF 卡刷写说明
            ```bash
            # 1. 先将 Armbian 镜像写入整张 TF 卡（/dev/sda）
            zcat Armbian_xx_s905_p201.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 2. 写入自制主线 U-Boot 到整张 TF 卡（/dev/sda，切勿带数字 1 或 2）
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 3. 同步缓存并安全弹出
            sync
            ```
          files: |
            Armbian_*_s905_p201.img.gz
            fip_output/u-boot.bin.sd.bin
