name: 北京联通Q5 Armbian S905L/P212 (GXL 792MHz)内核加载版TF/SD内置卡槽启动自用音乐镜像

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/create_s905L_LMS.yaml'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  ROOTFS_UUID: "EEEEEEEE"
  TZ: Asia/Shanghai

jobs:
  build-and-release:
    name: 编译 GXL 混合主线 U-Boot 并生成低内存引导镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 安装交叉编译链、QEMU 模拟器与镜像处理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git build-essential gcc-aarch64-linux-gnu \
              bison flex libssl-dev device-tree-compiler \
              python3 python3-dev swig bc u-boot-tools \
              curl jq parted kpartx dosfstools e2fsprogs util-linux dos2unix \
              qemu-user qemu-user-binfmt

      - name: 克隆相关源码仓库
        run: |
          git clone --depth 1 https://github.com/hexdump0815/u-boot-misc.git
          git clone --depth 1 https://github.com/LibreELEC/amlogic-boot-fip.git
          git clone --depth 1 -b v2024.01 https://source.denx.de/u-boot/u-boot.git

      - name: 编译主线 U-Boot (GXL P212 通用电视盒子配置)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p212_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 使用 JetHub-J80 (792MHz DDR3) BL2 签名封装 FIP 引导
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          chmod +x build-fip.sh
          ./build-fip.sh lepotato ../u-boot/u-boot.bin ../fip_output
          mv ../fip_output/u-boot.bin.sd.bin ../fip_output/1g-u-boot.bin.sd.bin
          ./build-fip.sh jethub-j80 ../u-boot/u-boot.bin ../fip_output
          cd ..
          rm fip_output/u-boot.bin
          ls -lh fip_output/*.bin

      - name: 交叉编译高版本 squeezelite
        run: |
          set -e
          echo "=== 配置 arm64 交叉编译环境 ==="
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^deb http://archive.ubuntu.com/ubuntu/|deb [arch=amd64] http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list || true
          sudo sed -i 's|^deb http://security.ubuntu.com/ubuntu/|deb [arch=amd64] http://security.ubuntu.com/ubuntu/|' /etc/apt/sources.list || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update

          echo "=== 安装交叉编译链与 arm64 开发库 ==="
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libasound2-dev:arm64 libflac-dev:arm64 libmad0-dev:arm64 \
            libvorbis-dev:arm64 libopus-dev:arm64 libsoxr-dev:arm64 \
            libavformat-dev:arm64 libavcodec-dev:arm64 libavutil-dev:arm64 \
            libmpg123-dev:arm64 libfaad-dev:arm64 libssl-dev:arm64 \
            libopusfile-dev:arm64 liblirc-dev:arm64

          echo "=== 克隆并交叉编译 squeezelite ==="
          cd "${{ github.workspace }}"
          rm -rf squeezelite-src
          git clone --depth 1 https://github.com/ralph-irving/squeezelite.git squeezelite-src
          cd squeezelite-src

          make clean
          make \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-I/usr/include/opus -I/usr/aarch64-linux-gnu/include" \
            LDFLAGS="-L/usr/aarch64-linux-gnu/lib -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib" \
            OPTS="-DDSD -DFFMPEG -DRESAMPLE -DVISEXPORT -DLINKALL -DIR -DUSE_SSL -DOPUS"

          echo "=== 验证产物 ==="
          test -f squeezelite || { echo "错误：交叉编译未生成 squeezelite"; exit 1; }
          file squeezelite | grep -q "ARM aarch64" || { echo "错误：产物不是 ARM aarch64 架构"; file squeezelite; exit 1; }
          ls -lh squeezelite

          echo "=== 放入 patch 目录，供 chroot 步骤复制 ==="
          mkdir -p "${{ github.workspace }}/patch"
          cp squeezelite "${{ github.workspace }}/patch/squeezelite_arm64"
          ls -lh "${{ github.workspace }}/patch/squeezelite_arm64"

          cd "${{ github.workspace }}"
          rm -rf squeezelite-src

      - name: 下载 Armbian S905X 基础镜像
        run: |
          set -e
          mkdir -p work_img
          cd work_img

          IMG_URL=$(curl -sL "https://api.github.com/repos/rmoyulong/packages_lang_golang/releases?per_page=10" \
            | jq -r '.[] 
              | select(.tag_name | test("backup_mini_bullseye"; "i"))   
              | .assets[] 
              | select(.name | test("Armbian_.*amlogic_s905x_bullseye_6.1.133_.*\\.img\\.gz$"))
              | .browser_download_url' \
            | head -n 1)

          echo "匹配到的下载链接: $IMG_URL"

          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            echo "错误：未能获取到 Armbian S905X bullseye 基础镜像下载链接！"
            exit 1
          fi

          curl -L "$IMG_URL" -o base_armbian.img.gz
          gunzip -c base_armbian.img.gz > armbian_s905_p212_LMS.img

      - name: 注入 U-Boot、安装老armbian版本及配置低内存引导、预装 squeezelite
        run: |
          set -e
          cd work_img

          ############### 给 p2 扩容（增大到 600M）开始 ######################################
          IMG=armbian_s905_p212_LMS.img
          GROW_MB=600          # 关键修改：从 200 提高到 600，确保 LMS 安装有足够空间
          ALIGN_MB=20

          P2_START_SECTOR=$(parted -ms "$IMG" unit s print | awk -F: '$1=="2"{gsub(/s/,"",$2); print $2}')
          CURRENT_P2_MB=$(parted -ms "$IMG" unit MB print | awk -F: '$1=="2"{gsub(/MB/,"",$4); printf "%.0f", $4}')

          if [ -z "$P2_START_SECTOR" ] || [ -z "$CURRENT_P2_MB" ]; then
            echo "无法解析 P2 分区信息，请检查镜像分区表" >&2
            exit 1
          fi

          ADD_MB=$((GROW_MB + ALIGN_MB))
          TARGET_P2_MB=$((CURRENT_P2_MB + GROW_MB))

          echo "P2 当前 ${CURRENT_P2_MB}MB，目标 ${TARGET_P2_MB}MB，文件追加 ${ADD_MB}MB..."

          dd if=/dev/zero bs=1M count="$ADD_MB" status=none >> "$IMG"

          sudo sgdisk -e "$IMG" >/dev/null 2>&1 || true

          sudo parted -s "$IMG" rm 2
          sudo parted -s "$IMG" unit s mkpart primary ext4 "${P2_START_SECTOR}s" 100%

          echo "P2 已扩容到约 ${TARGET_P2_MB}MB"
          ############### 给 p2 扩容结束 ######################################

          #############################################
          echo "正在关联循环设备并检查修复分区..."
          LOOP_DEV=$(sudo losetup --find --show --partscan armbian_s905_p212_LMS.img)
          sudo partprobe "$LOOP_DEV" 2>/dev/null || true
          sleep 1

          ROOT_PART=$(sudo blkid -s UUID -o value "${LOOP_DEV}p2")

          if [ ! -b "${LOOP_DEV}p2" ]; then
            echo "未找到 ${LOOP_DEV}p2，分区扫描失败" >&2
            sudo losetup -d "$LOOP_DEV"
            exit 1
          fi

          echo "正在对 ROOT 分区 (${LOOP_DEV}p2) 执行 e2fsck 预校验与修复..."
          sudo e2fsck -fy "${LOOP_DEV}p2" || rc=$?
          if [ "${rc:-0}" -gt 2 ]; then
            echo "e2fsck 返回 ${rc}，存在未修复错误" >&2
            sudo losetup -d "$LOOP_DEV"
            exit 1
          fi

          sudo tune2fs -O ^metadata_csum_seed "${LOOP_DEV}p2" 2>/dev/null || true
          sudo e2fsck -fy "${LOOP_DEV}p2" || rc=$?
          if [ "${rc:-0}" -gt 2 ]; then
            echo "e2fsck 第二次返回 ${rc}，存在未修复错误" >&2
            sudo losetup -d "$LOOP_DEV"
            exit 1
          fi

          echo "分区大小: $(sudo blockdev --getsize64 "${LOOP_DEV}p2") bytes"
          sudo resize2fs "${LOOP_DEV}p2"

          sync

          # ================= 挂载 ROOT 分区并安装软件 =================
          echo "正在挂载 ROOT 分区并通过 QEMU chroot 预装 squeezelite..."
          sudo mkdir -p /mnt/armbian_root

          sudo mount "${LOOP_DEV}p2" /mnt/armbian_root
          sudo mkdir -p /mnt/armbian_root/tmp/patch
          sudo cp -a "${{ github.workspace }}/patch/." /mnt/armbian_root/tmp/patch/

          echo "UUID=${ROOT_PART}   /      ext4  defaults,noatime,nodiratime,commit=600,errors=remount-ro    0 1" > /mnt/armbian_root/tmp/patch/fstab
          echo "LABEL=BOOT   /boot    vfat     defaults                                                    0 2" >> /mnt/armbian_root/tmp/patch/fstab
          echo "tmpfs        /tmp     tmpfs    defaults,nosuid                                             0 0" >> /mnt/armbian_root/tmp/patch/fstab
          cat /mnt/armbian_root/tmp/patch/fstab

          if [ -L /mnt/armbian_root/etc/resolv.conf ]; then
            sudo mv /mnt/armbian_root/etc/resolv.conf /mnt/armbian_root/etc/resolv.conf.bak
          elif [ -f /mnt/armbian_root/etc/resolv.conf ]; then
            sudo cp -a /mnt/armbian_root/etc/resolv.conf /mnt/armbian_root/etc/resolv.conf.bak
          fi
          sudo cp /etc/resolv.conf /mnt/armbian_root/etc/resolv.conf

          sudo cp /usr/bin/qemu-aarch64 /mnt/armbian_root/usr/bin/
          sudo mount -t proc /proc /mnt/armbian_root/proc
          sudo mount -t sysfs /sys /mnt/armbian_root/sys
          sudo mount -o bind /dev /mnt/armbian_root/dev
          sudo mount -o bind /dev/pts /mnt/armbian_root/dev/pts

          # 第一轮 chroot：基础包 + 系统配置
          sudo chroot /mnt/armbian_root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive

            source /tmp/patch/base64_heredoc.sh
            mkdir -p /etc/apt
            base64_heredoc list_src_apt | base64 -d | tee /etc/apt/sources.list > /dev/null

            apt-get update
            apt-get install -y --no-install-recommends wget dos2unix net-tools davfs2 cifs-utils ethtool screen alsa-utils alsa-tools sudo file mtools locales ffmpeg

            # 关键修改：清理 apt 缓存，释放空间给后续 LMS 安装
            apt-get clean
            rm -rf /var/cache/apt/archives/*.deb

            #################### 必要的设置开始 ######################
            mkdir -p /mnt/{aliyundrive,boot,rootfs,music,sd,usb,NAS}

            mkdir -p /etc/update-motd.d
            cp /tmp/patch/cats_banner /etc/cats_banner
            base64_heredoc list_src_banner | base64 -d | tee /etc/update-motd.d/95-cats-banner > /dev/null
            chmod +x /etc/update-motd.d/95-cats-banner

            rm -rf /etc/localtime
            ln -s /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

            mkdir -p /etc/default
            cp /tmp/patch/locale.conf /etc/default/locale
            cp /tmp/patch/locale.gen /etc/locale.gen
            cp /tmp/patch/locale.conf /etc/locale.conf

            base64_heredoc list_src_zarm | base64 -d | tee /etc/default/armbian-zram-config > /dev/null
            base64_heredoc list_src_zram_opt | base64 -d | tee /etc/sysctl.d/97-zram-opt.conf > /dev/null

            mkdir -p /etc/sysctl.d
            base64_heredoc list_src_LMS_network | base64 -d | tee /etc/sysctl.d/99-lms-network.conf > /dev/null
            echo '----- 99-lms-network.conf -----'
            cat /etc/sysctl.d/99-lms-network.conf

            cp /tmp/patch/.bashrc /root/.bashrc
            chmod 0644 /root/.bashrc
            #################### 必要的设置结束 ######################

            #################建立启动后运行一次的脚本-开始################################################
            mkdir -p /etc/systemd/system
            base64_heredoc list_src_resize_once | base64 -d | tee /etc/systemd/system/resize-once.service > /dev/null
            base64_heredoc list_src_resize_sh noecho | base64 -d | tee /etc/resize.sh > /dev/null
            chmod +x /etc/resize.sh
            #################建立启动后运行一次的脚本-结束################################################

            base64_heredoc list_src_mount_NAS | base64 -d | tee /etc/systemd/system/mnt-NAS.mount > /dev/null
          "

          # 第二轮 chroot：安装 LMS
          sudo chroot /mnt/armbian_root /bin/bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            source /tmp/patch/base64_heredoc.sh

            apt update
            apt-get install -y locales

            locale-gen zh_CN.UTF-8

            # 关键修改：安装 LMS 前检查可用空间（至少 300MB）
            AVAIL_KB=\$(df --output=avail / | tail -1)
            if [ \"\$AVAIL_KB\" -lt 307200 ]; then
              echo \"错误：根分区可用空间不足 300MB（当前 \$((AVAIL_KB/1024))MB），无法安全安装 LMS\" >&2
              df -h /
              exit 1
            fi
            echo \"根分区可用空间：\$((AVAIL_KB/1024))MB，满足安装要求\"

            git clone https://github.com/rmoyulong/packages_lang_golang golang

            rm -rf /var/lib/squeezeboxserver /var/log/squeezeboxserver
            mkdir -p /var/lib/squeezeboxserver/prefs
            mkdir -p /var/lib/squeezeboxserver/cache
            mkdir -p /var/log/squeezeboxserver

            dpkg -i ./golang/lms_arm.deb
            apt-get --fix-broken install -y

            cp /tmp/patch/fstab /etc/fstab
            cat /etc/fstab

            mkdir -p /usr/lib/systemd/system
            base64_heredoc list_src_squeezelite_service | base64 -d | tee /usr/lib/systemd/system/squeezelite.service > /dev/null

            # 关键修改：先确认服务文件存在再 enable
            if [ -f /lib/systemd/system/lyrionmusicserver.service ] || [ -f /usr/lib/systemd/system/lyrionmusicserver.service ]; then
              systemctl enable lyrionmusicserver
              echo \"lyrionmusicserver 服务已使能\"
            else
              echo \"错误：lyrionmusicserver.service 未找到，安装可能不完整\" >&2
              exit 1
            fi

            rm -rf ./golang
          "

          # 第三轮 chroot：拷贝高版本 squeezelite
          echo "准备拷贝高版本 squeezelite..."
          sudo chroot /mnt/armbian_root /bin/bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              mkdir -p /usr/local/bin
              cp /tmp/patch/squeezelite_arm64 /usr/local/bin/squeezelite
              chmod 0755 /usr/local/bin/squeezelite
              test -x /usr/local/bin/squeezelite || { echo "错误：squeezelite 未正确复制"; exit 1; }
              file /usr/local/bin/squeezelite

              apt-get clean
              rm -rf /var/lib/apt/lists/*
          '

          # =====================================================================
          # 收尾
          # =====================================================================
          echo "正在清理 chroot 环境..."
          sudo sync
          sleep 2

          echo "=== 验证镜像根分区内的 squeezelite ==="
          ls -lh /mnt/armbian_root/usr/local/bin/squeezelite || { echo "错误：镜像内未找到 squeezelite"; exit 1; }
          file /mnt/armbian_root/usr/local/bin/squeezelite | grep -q "ARM aarch64" || { echo "错误：镜像内的 squeezelite 架构不对"; exit 1; }
          echo "=== 镜像内 squeezelite 验证通过 ==="

          sudo umount /mnt/armbian_root/dev/pts 2>/dev/null || sudo umount -lf /mnt/armbian_root/dev/pts
          sudo umount /mnt/armbian_root/dev      2>/dev/null || sudo umount -lf /mnt/armbian_root/dev
          sudo umount /mnt/armbian_root/sys      2>/dev/null || sudo umount -lf /mnt/armbian_root/sys
          sudo umount /mnt/armbian_root/proc     2>/dev/null || sudo umount -lf /mnt/armbian_root/proc

          sudo rm -f /mnt/armbian_root/usr/bin/qemu-aarch64
          sudo rm -f /mnt/armbian_root/etc/resolv.conf
          if [ -e /mnt/armbian_root/etc/resolv.conf.bak ] || [ -L /mnt/armbian_root/etc/resolv.conf.bak ]; then
            sudo mv /mnt/armbian_root/etc/resolv.conf.bak /mnt/armbian_root/etc/resolv.conf
          fi
          sudo rm -rf /mnt/armbian_root/tmp/patch

          sudo sync
          sleep 2

          sudo mount -o remount,ro /mnt/armbian_root || true
          sleep 1
          sudo umount /mnt/armbian_root
          sleep 2

          echo "正在对 ROOT 分区做最终 e2fsck 修复..."
          rc=0
          sudo e2fsck -fy "${LOOP_DEV}p2" || rc=$?
          if [ "${rc:-0}" -gt 2 ]; then
            echo "最终 e2fsck 返回 ${rc}，文件系统仍有错" >&2
            sudo losetup -d "$LOOP_DEV"
            exit 1
          fi

          for ld in $(sudo losetup -j armbian_s905_p212_LMS.img | cut -d: -f1); do
            sudo losetup -d "$ld" || true
          done

          #================================================================
          echo "正在关联循环设备并修改 boot 分区..."
          LOOP_DEV=$(sudo losetup --find --show --partscan armbian_s905_p212_LMS.img)
          sudo partprobe "$LOOP_DEV" 2>/dev/null || true
          sleep 1

          echo "正在挂载 BOOT 分区..."
          sudo mkdir -p /mnt/armbian_boot
          sudo mount "${LOOP_DEV}p1" /mnt/armbian_boot

          if [ -f /mnt/armbian_boot/boot.scr ]; then
            sudo mv /mnt/armbian_boot/boot.scr /mnt/armbian_boot/boot.scr.bak
          fi
          if [ -f /mnt/armbian_boot/boot.cmd ]; then
            sudo mv /mnt/armbian_boot/boot.cmd /mnt/armbian_boot/boot.cmd.bak
          fi

          KERNEL_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uImage|zImage|vmlinuz)' | head -n 1)
          INITRD_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uInitrd|initrd)' | head -n 1)
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP_DEV}p2")

          source ${{ github.workspace }}/patch/base64_heredoc.sh

          echo "检测到内核文件: $KERNEL_FILE, 内存盘文件: $INITRD_FILE, 根分区 UUID: $ROOT_UUID"

          sudo mkdir -p /mnt/armbian_boot/extlinux
          base64_heredoc list_src_extlinux_s905 raw | base64 -d | sudo tee /mnt/armbian_boot/extlinux/extlinux.conf > /dev/null
          base64_heredoc list_src_uEnv | base64 -d | sudo tee /mnt/armbian_boot/uEnv.txt > /dev/null

          echo "生成的 extlinux.conf 内容如下："
          sudo cat /mnt/armbian_boot/extlinux/extlinux.conf
          echo "生成的 uEnv.txt 内容如下："
          sudo cat /mnt/armbian_boot/uEnv.txt

          sudo sync
          sudo umount /mnt/armbian_boot
          sudo losetup -d "${LOOP_DEV}"

          cp ${{ github.workspace }}/patch/u-boot.bin ../fip_output/u-boot.bin
          sudo dd if=../fip_output/u-boot.bin of=/dev/sda conv=fsync,notrunc bs=1 count=444
          sudo dd if=../fip_output/u-boot.bin of=/dev/sda conv=fsync,notrunc bs=512 skip=1 seek=1
          sync

          BUILD_DATE=$(date +%Y.%m.%d)
          OUT_NAME="Armbian_${BUILD_DATE}_s905_p212_LMS.img.gz"
          echo "正在压缩生成最终镜像: $OUT_NAME..."
          gzip -c armbian_s905_p212_LMS.img > "../${OUT_NAME}"
          rm -f base_armbian.img.gz armbian_s905_p212_LMS.img
          cd ..
          ls -lh "${OUT_NAME}"

      - name: 发布构建产物至 s905L_p212_LMS 标签
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905L_p212_LMS
          name: Armbian S905L/P212 (GXL 792MHz 低内存引导版) - 北京联通Q5音乐服务器
          body: |
            针对北京联通 Q5 (Amlogic GXL S905L / P212) 的 Armbian 自动化构建，集成 792MHz DDR3 BL2 + 主线 U-Boot 2024.01、低内存 `extlinux.conf` 引导配置，并已预装 **squeezelite** 与 **Lyrion Music Server**。

            适用于内置 eMMC/NAND 损坏的 Amlogic GXL 系列盒子，直接从外置 TF 卡冷启动主线 Armbian。

            u-boot.bin.sd.bin 适用于 500MB 内存的北京视讯 Q5
            1g-u-boot.bin.sd.bin 适用于 1GB 内存的北京视讯 Q5
            u-boot.bin 原厂北京视讯 Q5 的 U-BOOT（内存容量不限）

            ### TF 卡刷写说明 (Debian/Linux)
            ```bash
            zcat Armbian_*.img.gz | sudo dd of=/dev/sda bs=4M status=progress conv=fsync

            # 可选：单独重写主线 U-Boot
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=1 count=442
            sudo dd if=u-boot.bin.sd.bin of=/dev/sda conv=fsync bs=512 skip=1 seek=1

            # 或使用原厂 U-Boot
            sudo dd if=u-boot.bin of=/dev/sda conv=fsync,notrunc bs=1 count=444
            sudo dd if=u-boot.bin of=/dev/sda conv=fsync,notrunc bs=512 skip=1 seek=1
            sync
            ```
          files: |
            *.img.gz
            fip_output/*.bin
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
