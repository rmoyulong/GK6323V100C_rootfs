name: 编译trixie RootFS(Debian+Netplan+SSH/FTP/Nginx/PHP8/LMS)

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: 'Debian 套件(trixie = PHP 8.4)'
        required: false
        default: 'trixie'
  push:
    paths:
      - '.github/workflows/create_trixie_rootfs.yaml'

permissions:
  contents: write

env:
  DEBIAN_SUITE: ${{ github.event.inputs.debian_suite || 'trixie' }}
  MIRROR: http://ftp.cn.debian.org/debian/
  ROOTFS_DIR: ${{ github.workspace }}/rootfs
  OUT_DIR: ${{ github.workspace }}/out
  KERNEL_VERSION: 7.4-rc3

jobs:
  build-rootfs:
    name: 构建 RootFS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install debootstrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring gnupg dirmngr

      - name: Update debian-archive-keyring for trixie
        run: |
          set -euo pipefail
          wget -O /tmp/debian-archive-keyring.deb \
            http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo dpkg -i /tmp/debian-archive-keyring.deb
          rm -f /tmp/debian-archive-keyring.deb
          echo "[OK] debian-archive-keyring 2025.1 installed"

      # ★ 安装 QEMU 用户态模拟，使 x86 runner 能 chroot 运行 arm64 二进制
      - name: Install QEMU for arm64 emulation
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt || true
          echo "----- binfmt_misc 中已注册的 qemu 处理器 -----"
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || true
          # 确认 arm64 处理器存在（aarch64）
          if ls /proc/sys/fs/binfmt_misc/ | grep -qi 'qemu-aarch64'; then
            echo "[OK] qemu-aarch64 binfmt 已注册"
          else
            echo "[WARN] 未发现 qemu-aarch64 binfmt 注册项，尝试手动注册"
            sudo update-binfmts --enable qemu-aarch64 || true
          fi

      - name: Debootstrap base system
        run: |
          set -euo pipefail
          sudo mkdir -p "$ROOTFS_DIR"

          # 跨架构构建：用 qemu-debootstrap 替代 debootstrap，
          # 它会自动在 arm64 目标系统中注入 QEMU 静态二进制。
          # 已从 --include 移除 grub-efi-arm64（避免 debootstrap 阶段 postinst 失败），
          # 改为 chroot 配置阶段按需安装。
          sudo qemu-debootstrap \
            --arch=arm64 \
            --variant=minbase \
            --components=main,non-free-firmware \
            --include=systemd,systemd-sysv,dbus,ca-certificates,openssh-server,vsftpd,nginx,php8.4-cgi,php8.4-fpm,php8.4-mysql,procps,iproute2,iputils-ping,net-tools,vim,curl,wget,netplan.io,systemd-resolved,kmod,parted,dosfstools,e2fsprogs,rsync,fake-hwclock,systemd-timesyncd,usbutils,pciutils,evtest,kbd,dos2unix,mtools,firmware-realtek,firmware-iwlwifi,firmware-linux-free,ffmpeg,squeezelite,sudo,alsa-utils,alsa-tools,ethtool,cloud-guest-utils,wireless-regdb,zstd,git,nfs-common,rpcbind,jq \
            "$DEBIAN_SUITE" "$ROOTFS_DIR" \
            "$MIRROR"

      - name: Verify firmware packages
        run: |
          set -euo pipefail
          echo "===== 校验固件包是否装上（non-free-firmware 生效的标志）====="
          for pkg in firmware-realtek firmware-linux-free; do
            if sudo chroot "$ROOTFS_DIR" dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null \
                 | grep -q "install ok installed"; then
              echo "  [OK]   $pkg"
            else
              echo "  [FAIL] $pkg 未安装 —— 请检查 --components 是否为逗号分隔"
              exit 1
            fi
          done
          echo "----- 实际文件抽查 -----"
          ls -1 "$ROOTFS_DIR/lib/firmware/rtl_nic" 2>/dev/null | head -5 || true
          ls -1 "$ROOTFS_DIR/lib/firmware" 2>/dev/null | grep -i iwlwifi || true

      - name: Configure APT sources
        run: |
          set -euo pipefail
          # trixie 官方组件为 main / contrib / non-free / non-free-firmware，
          # 四者都写进来，后续想装 contrib、non-free 的包才不会找不到。
          sudo tee "$ROOTFS_DIR/etc/apt/sources.list" > /dev/null <<EOF
          deb $MIRROR ${DEBIAN_SUITE} main contrib non-free non-free-firmware
          deb $MIRROR ${DEBIAN_SUITE}-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security ${DEBIAN_SUITE}-security main contrib non-free non-free-firmware
          EOF
          echo "----- sources.list -----"
          cat "$ROOTFS_DIR/etc/apt/sources.list"

      - name: Configure LMS network sysctl
        run: |
          set -euo pipefail
          sudo mkdir -p "$ROOTFS_DIR/etc/sysctl.d"
          sudo tee "$ROOTFS_DIR/etc/sysctl.d/99-lms-network.conf" > /dev/null <<'EOF'
          # LMS 高解析度音乐异步推流网络优化
          net.core.somaxconn = 1024
          net.core.netdev_max_backlog = 5000
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 87380 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          EOF
          echo "----- 99-lms-network.conf -----"
          cat "$ROOTFS_DIR/etc/sysctl.d/99-lms-network.conf"

          #################建立启动后运行一次的脚本-开始################################################
          sudo mkdir -p "$ROOTFS_DIR/etc/systemd/system"
          # 注意：这里不能写 After=multi-user.target，
          # 否则与该服务自己的 WantedBy=multi-user.target 构成 ordering cycle，
          # systemd 会打断它、启动时机不确定，导致 resize2fs 不按预期执行。
          # 改为在 local-fs.target 之后（根分区已挂载）即可，且不产生环。
          sudo tee "$ROOTFS_DIR/etc/systemd/system/resize-once.service" > /dev/null <<'EOF'
          [Unit]
          Description=One-time resize script
          After=local-fs.target network-online.target remote-fs.target
          Wants=network-online.target remote-fs.target
          ConditionPathExists=/etc/resize.sh

          [Service]
          Type=oneshot
          ExecStart=/etc/resize.sh
          RemainAfterExit=no

          [Install]
          WantedBy=multi-user.target
          EOF

          # 注意：刻意不用 set -e。若某个 chown 因文件缺失返回非零就提前退出，
          # 后面的 resize2fs 便不会执行、首次开机扩容会失效。
          sudo tee "$ROOTFS_DIR/etc/resize.sh" > /dev/null <<'EOF'
          #!/bin/bash
          set -uo pipefail

          # ===== 修复 sudo 相关权限（tar 打包可能丢失属主/setuid 位） =====
          [ -e /etc/sudo.conf ] && chown root:root /etc/sudo.conf
          [ -e /etc/sudoers ]   && chown root:root /etc/sudoers
          [ -d /etc/sudoers.d ] && chown -R root:root /etc/sudoers.d
          [ -e /usr/bin/sudo ]  && chown root:root /usr/bin/sudo
          [ -e /usr/bin/sudo ]  && chmod 4755 /usr/bin/sudo

          # ===== 首次开机把根分区扩展到 eMMC 全部可用空间 =====
          resize2fs /dev/mmcblk0p18

          # ===== 强制 squeezeboxserver 的 uid/gid 为 1000/1000，
          #       与服务端 /etc/exports 的 anonuid=1000,anongid=1000 对齐，
          #       保证 NFS v3 挂载后 LMS 有权限读音乐文件 =====
          if ! getent group nogroup >/dev/null 2>&1; then
            groupadd -g 1000 nogroup || true
          fi
          if id squeezeboxserver >/dev/null 2>&1; then
            usermod -u 1000 -g nogroup squeezeboxserver 2>/dev/null || true
            groupmod -g 1000 nogroup 2>/dev/null || true
            chown -R squeezeboxserver:nogroup /var/lib/squeezeboxserver 2>/dev/null
            chown -R squeezeboxserver:nogroup /var/log/squeezeboxserver 2>/dev/null
          fi

          # ===== 触发 /etc/fstab 里的 NFS 挂载（_netdev 条目需在网络就绪后） =====
          mount -a -t nfs,nfs4 2>/dev/null || true

          # ===== 重启 LMS 让它能扫到 NFS 上的音乐 =====
          systemctl restart lyrionmusicserver 2>/dev/null

          # ===== 执行完毕后自毁：禁用并删除服务、删除脚本自身 =====
          systemctl disable resize-once.service 2>/dev/null
          rm -f /etc/systemd/system/resize-once.service
          rm -f /etc/resize.sh
          systemctl daemon-reload
          EOF
          #################建立启动后运行一次的脚本-结束################################################

          sudo mkdir -p "$ROOTFS_DIR/etc/update-motd.d"
          sudo cp ${{ github.workspace }}/patch/cats_banner $ROOTFS_DIR/etc/cats_banner
          sudo tee "$ROOTFS_DIR/etc/update-motd.d/40-cats_banner" > /dev/null <<'EOF'
          #!/bin/bash
          set -o pipefail
          cat /etc/cats_banner
          EOF
          sudo chmod +x $ROOTFS_DIR/etc/update-motd.d/40-cats_banner

          # 修改为中国时间
          sudo rm -rf $ROOTFS_DIR/etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Shanghai $ROOTFS_DIR/etc/localtime

          # 修正为中文环境
          sudo mkdir -p "$ROOTFS_DIR/etc/default"
          #sudo cp ${{ github.workspace }}/patch/locale.conf $ROOTFS_DIR/etc/default/locale
          sudo cp ${{ github.workspace }}/patch/locale.gen $ROOTFS_DIR/etc/locale.gen
          sudo cp ${{ github.workspace }}/patch/locale.conf $ROOTFS_DIR/etc/locale.conf

      - name: Configure netplan (DHCP dynamic IP)
        run: |
          set -euo pipefail
          sudo mkdir -p "$ROOTFS_DIR/etc/systemd/network"
          sudo ln -sf /dev/null "$ROOTFS_DIR/etc/systemd/network/99-default.link"

          sudo mkdir -p "$ROOTFS_DIR/etc/netplan"
          sudo tee "$ROOTFS_DIR/etc/netplan/01-netcfg.yaml" > /dev/null <<'EOF'
          network:
            version: 2
            renderer: networkd
            ethernets:
              all-eth:
                match:
                  name: "*"
                dhcp4: true
                dhcp6: true
          EOF
          sudo chmod 600 "$ROOTFS_DIR/etc/netplan/01-netcfg.yaml"

      - name: Configure rootfs (chroot)
        run: |
          set -euo pipefail

          sudo mount --bind /dev  "$ROOTFS_DIR/dev"
          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /sys  "$ROOTFS_DIR/sys"
          cleanup() {
            sudo umount "$ROOTFS_DIR/dev"  || true
            sudo umount "$ROOTFS_DIR/proc" || true
            sudo umount "$ROOTFS_DIR/sys"  || true
          }
          trap cleanup EXIT

          # chroot 内 DNS
          sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
          sudo cp /etc/resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # 把 LMS 安装脚本放进 rootfs 内再 chroot 执行
          sudo tee "$ROOTFS_DIR/tmp/install-lms.sh" >/dev/null <<'EOF'
          #!/bin/bash
          set -euo pipefail

          # 默认使用bash
          chsh -s /bin/bash root
          # 或者对普通用户
          #chsh -s /bin/bash squeezeboxserver

          cd /

          apt-get update

          apt-get install -y sudo locales exfat-fuse exfatprogs git zip unzip

          # 添加中文
          # 启用 zh_CN.UTF-8 / en_US.UTF-8（Trixie 默认这两行是注释）
          sed -i 's/^#[[:space:]]*zh_CN\.UTF-8[[:space:]]\+UTF-8/zh_CN.UTF-8 UTF-8/' /etc/locale.gen
          grep -q '^zh_CN\.UTF-8[[:space:]]\+UTF-8' /etc/locale.gen || echo 'zh_CN.UTF-8 UTF-8' >> /etc/locale.gen
          sed -i 's/^#[[:space:]]*en_US\.UTF-8[[:space:]]\+UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen

          # 直接生成数据，不依赖 locale-gen 的参数匹配逻辑
          LC_ALL=C localedef -i zh_CN -f UTF-8 zh_CN.UTF-8
          LC_ALL=C localedef -i en_US -f UTF-8 en_US.UTF-8
          LC_ALL=C locale-gen

          # 写变量声明（这一步写的才是 /etc/default/locale）
          update-locale LANG=zh_CN.UTF-8 LANGUAGE=zh_CN:zh LC_MESSAGES=zh_CN.UTF-8

          # 断言：没生成就让构建直接失败，不再"看着成功其实没生成"
          locale -a | grep -qi '^zh_CN\.utf8$' || { echo 'FATAL: zh_CN.UTF-8 not generated'; exit 1; }


          #git clone --depth 1 https://github.com/rmoyulong/packages_lang_golang golang

          rm -rf /var/lib/squeezeboxserver /var/log/squeezeboxserver

          mkdir -p /var/lib/squeezeboxserver/prefs
          mkdir -p /var/lib/squeezeboxserver/cache
          mkdir -p /var/log/squeezeboxserver
          
          # Fetch latest LMS arm/arm64 releases
            arm_IMG_URL=$(curl -sL "https://lyrion.org/downloads/#v920-development-build" \
              | jq -r '.[] 
                | select(.tag_name | test("lyrionmusicserver_9.2.0"; "i")) 
                | .assets[] 
                | select(.name | test("lyrionmusicserver_9.2.0~*_arm.deb\\.img\\.gz$")) 
                | .browser_download_url' \
              | head -n 1)
              
            echo $arm_IMG_URL
           wget $arm_IMG_URL -O /tmp/lms_arm.deb


          dpkg -i ./tmp/lms_arm.deb || true
          apt-get --fix-broken install -y

          #rm -rf ./golang
          EOF
          sudo chmod +x "$ROOTFS_DIR/tmp/install-lms.sh"
          sudo chroot "$ROOTFS_DIR" /bin/bash /tmp/install-lms.sh

          printf 'debian\n' | sudo tee "$ROOTFS_DIR/etc/hostname" > /dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\tdebian\n' | sudo tee "$ROOTFS_DIR/etc/hosts" > /dev/null

          sudo ln -sf /run/systemd/resolve/stub-resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # ★ 方案 A：只设密码，不 chage -d 0。
          #   root 密码 1234 立即可用，SSH 交互登录与 WinSCP SFTP 都能直接通过认证。
          echo "root:1234" | sudo chroot "$ROOTFS_DIR" /usr/sbin/chpasswd

          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' \
            "$ROOTFS_DIR/etc/ssh/sshd_config"

          echo "local_enable=YES" | sudo tee -a "$ROOTFS_DIR/etc/vsftpd.conf"
          echo "write_enable=YES" | sudo tee -a "$ROOTFS_DIR/etc/vsftpd.conf"

          sudo sed -i 's/^;*cgi.fix_pathinfo.*/cgi.fix_pathinfo=1/' \
            "$ROOTFS_DIR/etc/php/8.4/cgi/php.ini" || true

          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-networkd || true
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-networkd-wait-online || true
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-resolved || true
          sudo chroot "$ROOTFS_DIR" systemctl enable nginx php8.4-fpm ssh vsftpd || true
          sudo chroot "$ROOTFS_DIR" systemctl enable systemd-timesyncd || true
          sudo chroot "$ROOTFS_DIR" systemctl enable fake-hwclock || true
          sudo chroot "$ROOTFS_DIR" systemctl enable lyrionmusicserver || true
          sudo chroot "$ROOTFS_DIR" systemctl enable squeezelite || true
          sudo chroot "$ROOTFS_DIR" systemctl enable remote-fs.target || true

          sudo chmod +x "$ROOTFS_DIR/etc/resize.sh"
          sudo chroot "$ROOTFS_DIR" systemctl enable resize-once.service || true

          sudo chroot "$ROOTFS_DIR" apt-get clean
          sudo rm -rf "$ROOTFS_DIR/var/lib/apt/lists/"* || true

          # ★ 清理：qemu 静态二进制与临时安装脚本不能留进正式镜像
          #   （qemu-debootstrap 会把模拟器注入 /usr/bin，打包会一并带走，白占空间）
          sudo rm -f "$ROOTFS_DIR/usr/bin/qemu-aarch64-static"
          sudo rm -rf "$ROOTFS_DIR/usr/libexec/qemu-binfmt" || true
          sudo rm -f "$ROOTFS_DIR/tmp/install-lms.sh"

      - name: Configure audio (squeezelite + HDA no-powersave)
        run: |
          set -euo pipefail

          # ---------- squeezelite 的 ALSA 输出 ----------
          # hw:1,0 为硬件直通，采样率必须与声卡原生一致；
          # 若播放 44.1kHz 中断，请改回 plughw:1,0 让 ALSA 自动转换采样率。
          # 声卡编号（card 1）需在目标设备上用 aplay -l 实测确认。
          sudo tee "$ROOTFS_DIR/etc/default/squeezelite" > /dev/null <<'EOF'
          # Defaults for squeezelite initscript
          # sourced by /etc/init.d/squeezelite
          # installed at /etc/default/squeezelite by the maintainer scripts

          # The name for the squeezelite player:
          SL_NAME="Squeezelite"

          # ALSA output device
          # hw:1,0 为硬件直通；若采样率不匹配导致中断，改用 plughw:1,0
          SL_SOUNDCARD="hw:1,0"

          # Additional options to pass to squeezelite:
          SB_EXTRA_ARGS="-p 99 -r 44100-48000 -b 2048:3445 -C 5"
          EOF

          echo "----- /etc/default/squeezelite -----"
          sudo cat "$ROOTFS_DIR/etc/default/squeezelite"

          # ---------- 4) 设置LMS plugins ----------
          git clone --depth 1 https://github.com/rmoyulong/packages_lang_golang golang
          sudo mkdir -p "$ROOTFS_DIR/var/lib/squeezeboxserver/cache/InstalledPlugins/Plugins"
          sudo mkdir -p "$ROOTFS_DIR/var/lib/squeezeboxserver/prefs/plugin"
          sudo tar zxvfp "./golang/plugins.tar.gz" -C "$ROOTFS_DIR"
          rm -rf ./golang

          # ---------- 5) 添加GK6323V100C生成物-模块 ----------
          sudo mkdir -p "$ROOTFS_DIR/usr/lib/modules"
          wget --tries=3 --timeout=60 \
            https://github.com/rmoyulong/GK6323V100C/releases/download/gk6323v100c-latest/modules.tar.gz \
            -O modules.tar.gz
          sudo tar zxvfp "./modules.tar.gz" -C "$ROOTFS_DIR/usr"
          rm -f modules.tar.gz
          echo "----- /usr/lib/modules 内容 -----"
          ls -1 "$ROOTFS_DIR/usr/lib/modules/" || true

          # ---------- 6) 添加.bashrc 让ls有颜色 ----------
          sudo mkdir -p "$ROOTFS_DIR/root"
          sudo cp ${{ github.workspace }}/patch/.bashrc $ROOTFS_DIR/root/.bashrc

          # ---------- 7) 已移除 samba 配置（2026-11-24 起板子不再跑 smbd/wsdd2，
          #                板子只做 NAS 客户端，不对外共享文件；
          #                板子对外文件访问用 ssh/sftp 或 vsftpd） ----------

          # ---------- 8) 创建挂载点（NAS MUSIC 通过 NFS v3 挂载） ----------
          sudo mkdir -p $ROOTFS_DIR/mnt/{aliyundrive,boot,rootfs,music,sd,usb,NAS}

          # ---------- 9) 写 /etc/fstab（NFS v3 挂载 NAS 音乐目录）
          # 服务端：192.168.31.60:/mnt/music/music
          # 参数：nfsvers=3 锁死 v3；proto=tcp 走 TCP 防 UDP 丢包；
          #       nolock 禁用 NLM（省去 statd/rpcbind 依赖，只读扫描最稳）；
          #       soft,timeo=100,retrans=2 无响应 10s 报错不卡死；
          #       _netdev 等网络就绪再挂；noatime 少一半元数据访问；
          #       hard,intr,nofail 启动时服务端未就绪不卡死启动流程。
          sudo tee "$ROOTFS_DIR/etc/fstab" > /dev/null <<'EOF'
          # <file system>                           <mount point>  <type>  <options>                                                                         <dump> <pass>
          /dev/mmcblk0p18 /               ext4    defaults,noatime,errors=remount-ro  0       1
          tmpfs           /tmp            tmpfs   defaults,nosuid                     0       0
          proc            /proc          proc    defaults                             0       0
          sysfs           /sys           sysfs   defaults                             0       0
          devtmpfs        /dev           devtmpfs defaults                            0       0
          192.168.31.60:/mnt/music/music   /mnt/NAS  nfs nfsvers=3,proto=tcp,nolock,soft,timeo=100,retrans=2,_netdev,noatime,nofail,x-systemd.mount-timeout=15 0      0
          EOF
          echo "----- /etc/fstab -----"
          cat "$ROOTFS_DIR/etc/fstab"

      - name: Package rootfs
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          sudo tar --numeric-owner --acls --xattrs -zcf "$OUT_DIR/rootfs.tar.gz" -C "$ROOTFS_DIR" .
          ls -lh "$OUT_DIR/rootfs.tar.gz"

          ( cd "$OUT_DIR" && sha256sum rootfs.tar.gz > rootfs.tar.gz.sha256 )

          SIZE=$(stat -c%s "$OUT_DIR/rootfs.tar.gz")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            cd "$OUT_DIR"
            split -b 1900m rootfs.tar.gz rootfs.tar.gz.part-
            rm -f rootfs.tar.gz
            ls -lh
          fi

      - name: Verify output files
        run: |
          set -euo pipefail
          ls -lh "$OUT_DIR"

          # ---------- 1. 直接用已构建好的 rootfs 目录测量大小 ----------
          #   不再把 tar 解压再重建：普通用户解压会丢失 root:root 属主
          #   （镜像里 /bin、/etc 等会变成 runner 的 uid），
          #   直接以 root 读取 $ROOTFS_DIR 才能保证属主、权限、设备节点正确。
          USED_KB="$(sudo du -sk "$ROOTFS_DIR" | awk '{print $1}')"
          USED_BYTES=$((USED_KB * 1024))
          # 已启用首次开机自动扩容，image 只多留 150MB 余量即可
          EXTRA_BYTES=$((150 * 1024 * 1024))
          TOTAL_BYTES=$((USED_BYTES + EXTRA_BYTES))

          MiB=$((1024 * 1024))
          TOTAL_BYTES=$(( (TOTAL_BYTES + MiB - 1) / MiB * MiB ))

          echo "Rootfs used : $((USED_BYTES / 1024 / 1024)) MiB"
          echo "Image size  : $((TOTAL_BYTES / 1024 / 1024)) MiB"

          # ---------- 2. 创建 ext4 镜像（-d 直接写入目录，保留属主） ----------
          IMG="$OUT_DIR/rootfs.img"
          IMG_GZ="$OUT_DIR/rootfs.img.gz"
          sudo rm -f "$IMG"
          sudo truncate -s "$TOTAL_BYTES" "$IMG"
          sudo mkfs.ext4 -q -F -L rootfs -d "$ROOTFS_DIR" "$IMG"

          # ---------- 3. 完整性校验（真检查，不再用 -n + || true 吞掉结果） ----------
          ls -lh "$IMG"
          file "$IMG"
          echo "正在对生成的 ext4 镜像做完整性检查..."
          rc=0
          sudo e2fsck -fy "$IMG" || rc=$?
          if [ "$rc" -gt 2 ]; then
            echo "e2fsck 失败，返回码 $rc" >&2
            exit 1
          fi
          echo "[OK] e2fsck 通过（返回码 $rc；0=干净，1/2=已自动修复）"

          # ---------- 4. 压缩，并删除未压缩镜像，避免 release 体积翻倍 ----------
          echo "正在压缩镜像..."
          sudo gzip -c "$IMG" > "$IMG_GZ"
          sudo rm -f "$IMG"
          ls -lh "$IMG_GZ"

          echo "rootfs.img.gz created at $IMG_GZ ($((TOTAL_BYTES / 1024 / 1024)) MiB)"

      - name: Create Release and upload
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          tag: arm64-rootfs-${{ env.DEBIAN_SUITE }}-latest
          name: arm64-rootfs-${{ env.DEBIAN_SUITE }}-latest
          artifacts: ${{ env.OUT_DIR }}/*
          body: |
            Debian ${{ env.DEBIAN_SUITE }} rootfs (arm64)

            **🧊 固件信息**

            - ➦ 💻 固件平台：arm64-linux GK6323V100C（四核 64 位 ARM Cortex-A55）
            - ➦ 🚀 内核版本：${{ env.KERNEL_VERSION }}（配合 kernel-image 发布使用）
            - ➦ 📦 软件包：openssh-server / vsftpd / nginx / php8.4-cgi / php8.4-fpm / LMS / nfs-common
            - ➦ 🎵 音频：squeezelite 默认 hw:1,0 若播放中断请改用 plughw:1,0
            - ➦ 📁 挂载：已预置 /etc/fstab 通过 NFS v3 挂载 NAS 音乐目录到 /mnt/NAS，首次开机会自动 mount -a
            ---

            **初始 root 密码：`1234`**
            SSH 与 WinSCP SFTP 均可直接用 root / 1234 登录，登录后请尽快修改密码。

            **NAS NFS 挂载（已写好 /etc/fstab）**

              192.168.31.60:/mnt/music/music  →  /mnt/NAS
              协议：NFS v3（TCP / nolock / soft / _netdev / nofail）

            请确认服务端 /etc/exports 已导出：
              /mnt/music/music 192.168.1.0/24(ro,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000)

            首次开机时 resize.sh 会把 squeezeboxserver 的 uid/gid 对齐为 1000/nogroup，
            与服务端 anonuid=1000/anongid=1000 一致，确保 LMS 有权限读音乐。

            若下载到的是 rootfs.tar.gz，直接解压：
              tar -xzf rootfs.tar.gz -C /目标分区

            若下载到的是 rootfs.tar.gz.part-* 分片，先合并再校验：
              cat rootfs.tar.gz.part-* > rootfs.tar.gz
              sha256sum -c rootfs.tar.gz.sha256
