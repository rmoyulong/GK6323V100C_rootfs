name: 构建北京联通Q5 Armbian S905L/P212 (GXL 792MHz 16-bit 低内存版 + Trixie + LMS 9.2.0)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/creat_s905L.yaml'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 编译 GXL 混合主线 U-Boot 并生成自定义 Trixie 镜像
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 安装交叉编译链、QEMU 模拟器与镜像处理依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-aarch64-linux-gnu \
            bison flex libssl-dev device-tree-compiler \
            python3 python3-dev swig bc u-boot-tools \
            curl jq parted kpartx dosfstools e2fsprogs util-linux \
            qemu-user-static binfmt-support

      - name: 克隆相关源码仓库
        run: |
          git clone --depth 1 https://github.com
          git clone --depth 1 https://github.com
          git clone --depth 1 -b v2024.01 https://denx.de

      - name: 编译主线 U-Boot (GXL P212 通用电视盒子配置)
        run: |
          cd u-boot
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- p212_defconfig
          make ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: 使用 JetHub-J80 (792MHz 16-bit 1080mV) BL2 签名封装 FIP 引导
        run: |
          mkdir -p fip_output
          cd amlogic-boot-fip
          chmod +x build-fip.sh
          ./build-fip.sh jethub-j80 ../u-boot/u-boot.bin ../fip_output
          cd ..
          ls -lh fip_output/u-boot.bin.sd.bin

      - name: 下载 Armbian S905X (Trixie) 基础镜像与 LMS 9.2.0
        run: |
          mkdir -p work_img
          cd work_img

          RELEASE_JSON=$(curl -sL https://github.com)
          IMG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Armbian_.*_amlogic_s905x_trixie_.*\\.img\\.gz$")) | .browser_download_url' | head -n 1)
          if [ -z "$IMG_URL" ] || [ "$IMG_URL" = "null" ]; then
            IMG_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("Armbian_.*_amlogic_s905x_.*\\.img\\.gz$")) | .browser_download_url' | head -n 1)
          fi
          curl -L "$IMG_URL" -o base_armbian.img.gz
          gunzip -c base_armbian.img.gz > armbian_s905_p212.img

          LMS_URL=$(curl -sL https://lyrion.org | grep -oE 'https://downloads\.lms-community\.org/LyrionMusicServer_v9\.2\.0/lyrionmusicserver_9\.2\.0~[0-9]+_arm\.deb' | head -n 1)
          if [ -z "$LMS_URL" ]; then
            LMS_URL="https://lms-community.org"
          fi
          curl -L "$LMS_URL" -o lms_9.2.0_arm.deb

      - name: 扩容镜像、注入 U-Boot 并在 Chroot 中安装定制软件与低内存优化
        run: |
          set -e
          cd work_img

          echo "1. 扩容镜像第二分区 (+1500MB)..."
          P2_START_SECTOR=$(parted -ms armbian_s905_p212.img unit s print | awk -F: '$1=="2"{gsub(/s/,"",$2); print $2}')
          dd if=/dev/zero bs=1M count=1500 >> armbian_s905_p212.img
          sudo parted -s armbian_s905_p212.img rm 2
          sudo parted -s armbian_s905_p212.img unit s mkpart primary ext4 "${P2_START_SECTOR}s" 100%

          echo "2. 写入 792MHz 16-bit 主线 U-Boot..."
          dd if=../fip_output/u-boot.bin.sd.bin of=armbian_s905_p212.img conv=notrunc,fsync bs=1 count=442
          dd if=../fip_output/u-boot.bin.sd.bin of=armbian_s905_p212.img conv=notrunc,fsync bs=512 skip=1 seek=1

          echo "3. 关联循环设备并扩展 ext4 文件系统..."
          LOOP_DEV=$(sudo losetup --find --show --partscan armbian_s905_p212.img)
          sudo e2fsck -fy "${LOOP_DEV}p2" || true
          sudo tune2fs -O ^metadata_csum_seed "${LOOP_DEV}p2" 2>/dev/null || true
          sudo resize2fs "${LOOP_DEV}p2"

          sudo mkdir -p /mnt/armbian_root /mnt/armbian_boot
          sudo mount "${LOOP_DEV}p2" /mnt/armbian_root
          sudo mount "${LOOP_DEV}p1" /mnt/armbian_boot

          echo "4. 预建挂载目录、拷贝 LMS 安装包并准备 Chroot 环境..."
          sudo mkdir -p /mnt/armbian_root/mnt/{NAS,music,sd,rootfs,boot,usb}
          sudo cp lms_9.2.0_arm.deb /mnt/armbian_root/tmp/
          sudo cp /usr/bin/qemu-aarch64-static /mnt/armbian_root/usr/bin/
          sudo cp /usr/bin/qemu-arm-static /mnt/armbian_root/usr/bin/

          sudo mount --bind /dev /mnt/armbian_root/dev
          sudo mount --bind /dev/pts /mnt/armbian_root/dev/pts
          sudo mount -t proc /proc /mnt/armbian_root/proc
          sudo mount -t sysfs /sys /mnt/armbian_root/sys
          sudo mv /mnt/armbian_root/etc/resolv.conf /mnt/armbian_root/etc/resolv.conf.bak 2>/dev/null || true
          sudo cp /etc/resolv.conf /mnt/armbian_root/etc/resolv.conf

          echo "5. 在 Chroot 中安装 Trixie 软件包、LMS 9.2.0 并执行低内存调优..."
          sudo chroot /mnt/armbian_root /bin/bash -e << 'CHROOT_EOF'
export DEBIAN_FRONTEND=noninteractive

if ! grep -q "trixie" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null; then
  sed -i 's/bookworm/trixie/g' /etc/apt/sources.list 2>/dev/null || true
  sed -i 's/bookworm/trixie/g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
  sed -i 's/bookworm/trixie/g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
fi

dpkg --add-architecture armhf
apt-get update

apt-get install -y --no-install-recommends \
  ffmpeg squeezelite alsa-utils alsa-tools ethtool cloud-guest-utils \
  nginx php8.4-cgi php8.4-fpm php8.4-mysql \
  procps iproute2 iputils-ping net-tools vim curl wget \
  usbutils pciutils dos2unix mtools parted dosfstools e2fsprogs \
  rsync fake-hwclock sudo samba samba-common-bin smbclient wsdd2 \
  locales exfat-fuse exfatprogs git zip unzip \
  libc6:armhf libstdc++6:armhf zlib1g:armhf libcrypt1:armhf

dpkg -i /tmp/lms_9.2.0_arm.deb || apt-get install -f -y
rm -f /tmp/lms_9.2.0_arm.deb

# PHP 8.4 FPM 省内存按需模式
if [ -f /etc/php/8.4/fpm/pool.d/www.conf ]; then
  sed -i 's/^pm = .*/pm = ondemand/' /etc/php/8.4/fpm/pool.d/www.conf
  sed -i 's/^pm.max_children = .*/pm.max_children = 4/' /etc/php/8.4/fpm/pool.d/www.conf
  sed -i 's/^;pm.process_idle_timeout = .*/pm.process_idle_timeout = 10s/' /etc/php/8.4/fpm/pool.d/www.conf
fi

# ZRAM zstd 压缩与内核内存调优 (适配 512MB 物理内存)
cat > /etc/default/armbian-zram-config << 'ZRAM_EOF'
ENABLED=true
ZRAM_PERCENTAGE=120
MEM_LIMIT_PERCENTAGE=100
ZRAM_MAX_DEVICES=4
SWAP_ALGORITHM=zstd
ZRAM_EOF

cat > /etc/sysctl.d/99-zram-opt.conf << 'SYSCTL_EOF'
vm.swappiness=150
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.page-cluster=0
SYSCTL_EOF

# 启用 ttyAML0 串口终端登录
mkdir -p /etc/systemd/system/getty.target.wants
if [ -f /usr/lib/systemd/system/serial-getty@.service ]; then
  ln -sf /usr/lib/systemd/system/serial-getty@.service /etc/systemd/system/getty.target.wants/serial-getty@ttyAML0.service
elif [ -f /lib/systemd/system/serial-getty@.service ]; then
  ln -sf /lib/systemd/system/serial-getty@.service /etc/systemd/system/getty.target.wants/serial-getty@ttyAML0.service
fi

apt-get clean
rm -rf /var/lib/apt/lists/*
CHROOT_EOF

          echo "6. 清理 Chroot 挂载并配置低内存 extlinux.conf..."
          sudo umount /mnt/armbian_root/sys
          sudo umount /mnt/armbian_root/proc
          sudo umount /mnt/armbian_root/dev/pts
          sudo umount /mnt/armbian_root/dev
          sudo rm -f /mnt/armbian_root/usr/bin/qemu-aarch64-static /mnt/armbian_root/usr/bin/qemu-arm-static
          sudo mv /mnt/armbian_root/etc/resolv.conf.bak /mnt/armbian_root/etc/resolv.conf 2>/dev/null || true

          [ -f /mnt/armbian_boot/boot.scr ] && sudo mv /mnt/armbian_boot/boot.scr /mnt/armbian_boot/boot.scr.bak
          KERNEL_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uImage|zImage|vmlinuz)' | head -n 1)
          INITRD_FILE=$(ls /mnt/armbian_boot/ | grep -E '^(uInitrd|initrd)' | head -n 1)
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP_DEV}p2")

          sudo mkdir -p /mnt/armbian_boot/extlinux
          sudo bash -c "cat > /mnt/armbian_boot/extlinux/extlinux.conf << 'EXT_EOF'
LABEL Armbian
  LINUX /${KERNEL_FILE}
  INITRD /${INITRD_FILE}
  FDT /dtb/amlogic/meson-gxl-s905x-p212.dtb
  APPEND root=UUID=${ROOT_UUID} rootflags=data=writeback rw console=ttyAML0,115200n8 console=tty0 no_console_suspend consoleblank=0 fsck.fix=yes fsck.repair=yes net.ifnames=0
EXT_EOF"

          sudo sync
          sudo umount /mnt/armbian_boot
          sudo umount /mnt/armbian_root
          sudo e2fsck -fy "${LOOP_DEV}p2"
          sudo losetup -d "${LOOP_DEV}"
          rm -f base_armbian.img.gz lms_9.2.0_arm.deb

          BUILD_DATE=$(date +%Y.%m.%d)
          OUT_NAME="Armbian_${BUILD_DATE}_s905_p212_trixie_lms.img.gz"
          gzip -c armbian_s905_p212.img > "../${OUT_NAME}"
          rm -f armbian_s905_p212.img
          cd ..
          ls -lh "${OUT_NAME}"

      - name: 发布构建产物至 s905L_p212 标签
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s905L_p212
          name: Armbian S905L/P212 (792MHz 16-bit + Trixie + LMS 9.2.0) - 北京联通Q5
          body: |
            针对北京联通 Q5 (Amlogic GXL S905L / P212 512MB 16-bit) 的 Armbian Trixie 自动化构建，集成 792MHz 主线 U-Boot 2024.01、低内存引导、LMS 9.2.0、Squeezelite、PHP 8.4 FPM（ondemand 模式）及 ZRAM zstd 压缩调优。
          files: |
            Armbian_*_s905_p212_trixie_lms.img.gz
            fip_output/u-boot.bin.sd.bin
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
